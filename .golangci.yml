version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    goconst:
      min-len: 3
      min-occurrences: 6

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - revive
          - gosec
          - errorlint
          - noctx
      - path: validation\.go
        linters:
          - goconst
      - path: hack/
        linters:
          - gosec
      # strings.Builder.WriteString never returns an error (always nil)
      - linters:
          - gosec
        source: "WriteString"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/hupe1980/snowplane
