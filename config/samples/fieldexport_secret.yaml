# Export sensitive data from a User resource into a Secret.
# Useful for passing connection strings to application pods.
#
# Optional fields:
#   from.resource.namespace — source namespace (defaults to FieldExport's namespace)
#   to.namespace — target namespace (defaults to FieldExport's namespace)
apiVersion: snowplane.hupe1980.github.io/v1alpha1
kind: FieldExport
metadata:
  name: user-login-export
  namespace: snowplane-system
spec:
  from:
    resource:
      kind: User
      name: app-service-user
    path: ".status.showOutput.loginName"
  to:
    kind: Secret
    name: snowplane-credentials
    key: login-name
