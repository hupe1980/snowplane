apiVersion: snowplane.hupe1980.github.io/v1alpha1
kind: MaskingPolicyApplication
metadata:
  name: table-column-masking-ref
spec:
  providerRef:
    name: default
  # Use a PolicyRef to reference an existing MaskingPolicy CR instead of a raw name.
  policyRef:
    name: my-masking-policy
  tableName: '"MY_DB"."MY_SCHEMA"."MY_TABLE"'
  columnName: EMAIL
  # Optional: specify columns for conditional masking.
  usingColumns:
    - EMAIL
    - ROLE
