apiVersion: snowplane.hupe1980.github.io/v1alpha1
kind: PasswordPolicy
metadata:
  name: strict-password-policy
spec:
  providerRef:
    name: default
  name: STRICT_PASSWORD_POLICY
  databaseRef:
    name: my-database
  schemaRef:
    name: my-schema
  passwordMinLength: 12
  passwordMaxLength: 256
  passwordMinUpperCaseChars: 2
  passwordMinLowerCaseChars: 2
  passwordMinNumericChars: 1
  passwordMinSpecialChars: 1
  passwordMaxAgeDays: 90
  passwordMaxRetries: 5
  passwordLockoutTimeMins: 30
  passwordHistory: 10
  comment: "Strict password policy managed by Snowplane"
