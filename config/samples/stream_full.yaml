apiVersion: snowplane.hupe1980.github.io/v1alpha1
kind: Stream
metadata:
  name: my-append-stream
spec:
  providerRef:
    name: default
  name: MY_APPEND_STREAM
  databaseName: MY_DB
  schemaName: MY_DB.MY_SCHEMA
  sourceType: TABLE
  sourceName: '"MY_DB"."MY_SCHEMA"."MY_TABLE"'
  appendOnly: true
  showInitialRows: true
  comment: "Append-only stream on a table with initial rows"
