# ProviderConfig with username/password authentication.
# Replace placeholder values with your Snowflake account details.
apiVersion: snowplane.hupe1980.github.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: snowplane-system
spec:
  account: "<YOUR_ACCOUNT_IDENTIFIER>"
  region: "<YOUR_REGION>"
  user: "<YOUR_USER>"
  role: "SYSADMIN"
  warehouse: "COMPUTE_WH"
  authenticationType: UsernamePassword
  credentials:
    secretRef:
      name: snowflake-credentials
      key: password
