# Template Secret for Snowflake credentials.
# For key pair auth: populate privateKey with the PEM-encoded RSA private key.
# For password auth: populate password with the Snowflake user's password.
apiVersion: v1
kind: Secret
metadata:
  name: snowflake-credentials
  namespace: snowplane-system
type: Opaque
stringData:
  # Key pair authentication:
  # privateKey: |
  #   -----BEGIN PRIVATE KEY-----
  #   MIIEvAIBADANBg...
  #   -----END PRIVATE KEY-----
  # passphrase: "optional-passphrase"

  # Username/password authentication:
  # password: "your-snowflake-password"
