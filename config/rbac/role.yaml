---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snowplane-controller-role
rules:
# Core resources — Secrets: read for ProviderConfig credentials,
# create/update/patch for FieldExport targets, delete for cleanup
# of empty FieldExport-managed Secrets only (labeled managed-by:snowplane-fieldexport).
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Leader election.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
# Snowplane CRDs - full lifecycle.
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases
  - schemas
  - warehouses
  - accountroles
  - databaseroles
  - accountrolegrants
  - databaserolegrants
  - sharegrants
  - grantownerships
  - users
  - tables
  - views
  - stages
  - tasks
  - streams
  - tags
  - networkpolicies
  - resourcemonitors
  - maskingpolicies
  - rowaccesspolicies
  - dynamictables
  - fileformats
  - pipes
  - storageintegrations
  - securityintegrations
  - passwordpolicies
  - networkrules
  - fieldexports
  - providerconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/status
  - schemas/status
  - warehouses/status
  - accountroles/status
  - databaseroles/status
  - accountrolegrants/status
  - databaserolegrants/status
  - sharegrants/status
  - grantownerships/status
  - users/status
  - tables/status
  - views/status
  - stages/status
  - tasks/status
  - streams/status
  - tags/status
  - networkpolicies/status
  - resourcemonitors/status
  - maskingpolicies/status
  - rowaccesspolicies/status
  - dynamictables/status
  - fileformats/status
  - pipes/status
  - storageintegrations/status
  - securityintegrations/status
  - passwordpolicies/status
  - networkrules/status
  - fieldexports/status
  - providerconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/finalizers
  - schemas/finalizers
  - warehouses/finalizers
  - accountroles/finalizers
  - databaseroles/finalizers
  - accountrolegrants/finalizers
  - databaserolegrants/finalizers
  - sharegrants/finalizers
  - grantownerships/finalizers
  - users/finalizers
  - tables/finalizers
  - views/finalizers
  - stages/finalizers
  - tasks/finalizers
  - streams/finalizers
  - tags/finalizers
  - networkpolicies/finalizers
  - resourcemonitors/finalizers
  - maskingpolicies/finalizers
  - rowaccesspolicies/finalizers
  - dynamictables/finalizers
  - fileformats/finalizers
  - pipes/finalizers
  - storageintegrations/finalizers
  - securityintegrations/finalizers
  - passwordpolicies/finalizers
  - networkrules/finalizers
  - fieldexports/finalizers
  - providerconfigs/finalizers
  verbs:
  - update
