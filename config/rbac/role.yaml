---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snowplane-controller-role
rules:
# Core resources — Secrets: read for ProviderConfig credentials,
# create/update/patch for FieldExport targets, delete for cleanup
# of empty FieldExport-managed Secrets only (labeled managed-by:snowplane-fieldexport).
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Leader election.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
# Snowplane CRDs - full lifecycle.
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases
  - schemas
  - warehouses
  - accountroles
  - databaseroles
  - accountrolegrants
  - databaserolegrants
  - sharegrants
  - grantownerships
  - users
  - tables
  - views
  - stages
  - tasks
  - tags
  - tagassociations
  - networkpolicyattachments
  - passwordpolicyattachments
  - maskingpolicyapplications
  - networkpolicies
  - resourcemonitors
  - maskingpolicies
  - rowaccesspolicies
  - dynamictables
  - fileformats
  - sequences
  - externaltables
  - materializedviews
  - pipes
  - storageintegrations
  - securityintegrations
  - passwordpolicies
  - networkrules
  - alerts
  - notificationintegrations
  - accountroleassignments
  - databaseroleassignments
  - streamontables
  - streamonviews
  - streamonexternaltables
  - streamondirectorytables
  - streamondynamictables
  - fieldexports
  - providerconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/status
  - schemas/status
  - warehouses/status
  - accountroles/status
  - databaseroles/status
  - accountrolegrants/status
  - databaserolegrants/status
  - sharegrants/status
  - grantownerships/status
  - users/status
  - tables/status
  - views/status
  - stages/status
  - tasks/status
  - tags/status
  - tagassociations/status
  - networkpolicyattachments/status
  - passwordpolicyattachments/status
  - maskingpolicyapplications/status
  - networkpolicies/status
  - resourcemonitors/status
  - maskingpolicies/status
  - rowaccesspolicies/status
  - dynamictables/status
  - fileformats/status
  - sequences/status
  - externaltables/status
  - materializedviews/status
  - pipes/status
  - storageintegrations/status
  - securityintegrations/status
  - passwordpolicies/status
  - networkrules/status
  - alerts/status
  - notificationintegrations/status
  - accountroleassignments/status
  - databaseroleassignments/status
  - streamontables/status
  - streamonviews/status
  - streamonexternaltables/status
  - streamondirectorytables/status
  - streamondynamictables/status
  - fieldexports/status
  - providerconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/finalizers
  - schemas/finalizers
  - warehouses/finalizers
  - accountroles/finalizers
  - databaseroles/finalizers
  - accountrolegrants/finalizers
  - databaserolegrants/finalizers
  - sharegrants/finalizers
  - grantownerships/finalizers
  - users/finalizers
  - tables/finalizers
  - views/finalizers
  - stages/finalizers
  - tasks/finalizers
  - tags/finalizers
  - tagassociations/finalizers
  - networkpolicyattachments/finalizers
  - passwordpolicyattachments/finalizers
  - maskingpolicyapplications/finalizers
  - networkpolicies/finalizers
  - resourcemonitors/finalizers
  - maskingpolicies/finalizers
  - rowaccesspolicies/finalizers
  - dynamictables/finalizers
  - fileformats/finalizers
  - sequences/finalizers
  - externaltables/finalizers
  - materializedviews/finalizers
  - pipes/finalizers
  - storageintegrations/finalizers
