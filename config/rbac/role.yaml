---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snowplane-controller-role
rules:
# Core resources — Secrets: read for ProviderConfig credentials,
# create/update/patch for FieldExport targets, delete for cleanup
# of empty FieldExport-managed Secrets only (labeled managed-by:snowplane-fieldexport).
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Events (events.k8s.io) — controller-runtime uses this API group by default.
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
# Leader election.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
# Snowplane CRDs - full lifecycle.
- apiGroups:
  - snowplane.hupe1980.github.io
