apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snowplane-controller-manager
  namespace: snowplane-system
  labels:
    app.kubernetes.io/name: snowplane
    app.kubernetes.io/component: controller-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snowplane
      app.kubernetes.io/component: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrape on metrics port.
    - ports:
        - port: 8080
          protocol: TCP
    # Health probes from the kubelet.
    - ports:
        - port: 8081
          protocol: TCP
  egress:
    # Kubernetes API server (HTTPS).
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Snowflake HTTPS (port 443) — already covered above; listed explicitly
    # for clarity. In production, restrict to the Snowflake account endpoint
    # using a CIDR-based egress rule or a service mesh.
