---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: providerconfigs.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: ProviderConfig
    listKind: ProviderConfigList
    plural: providerconfigs
    shortNames:
    - pc
    singular: providerconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.account
      name: ACCOUNT
      type: string
    - jsonPath: .spec.authenticationType
      name: AUTH
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProviderConfig configures the Snowflake connection for the Snowplane
          operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProviderConfigSpec defines the desired state of ProviderConfig.
            properties:
              account:
                description: Account is the Snowflake account identifier (e.g. "xy12345"
                  or "orgname-accountname").
                maxLength: 255
                minLength: 1
                type: string
              allowedDatabases:
                description: |-
                  AllowedDatabases restricts which Snowflake databases may be targeted by resources
                  using this ProviderConfig. An empty list means all databases are allowed.
                  Entries are matched case-insensitively against the resolved database name.
                  A list containing "*" means all databases are allowed.
                items:
                  type: string
                type: array
              allowedNamespaceSelector:
                description: |-
                  AllowedNamespaceSelector restricts which namespaces may reference this ProviderConfig
                  using Kubernetes label matching. A namespace is allowed if its labels match this selector.
                  This field uses OR semantics with AllowedNamespaces — a namespace is allowed if it
                  matches either the static list or the label selector.
                  If both AllowedNamespaces and AllowedNamespaceSelector are nil/empty, all namespaces
                  are allowed.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              allowedNamespaces:
                description: |-
                  AllowedNamespaces restricts which namespaces may reference this ProviderConfig.
                  An empty list means all namespaces are allowed (unless AllowedNamespaceSelector is set).
                  A list containing "*" means all namespaces are allowed.
                  If set to specific namespace names, only resources in those namespaces can use this ProviderConfig.
                  When both AllowedNamespaces and AllowedNamespaceSelector are set, a namespace is
                  allowed if it matches either the static list or the label selector (OR semantics).
                items:
                  type: string
                type: array
              allowedRefNamespaces:
                description: |-
                  AllowedRefNamespaces restricts which namespaces may be referenced via
                  cross-namespace ObjectReference fields (e.g. databaseRef.namespace,
                  schemaRef.namespace, secretRef.namespace).
                  An empty list means cross-namespace references are unrestricted.
                  A list containing "*" means all namespaces are allowed.
                  A list containing only the special value "SAME" means only same-namespace
                  references are permitted (cross-namespace references are blocked entirely).
                items:
                  type: string
                type: array
              allowedSchemas:
                description: |-
                  AllowedSchemas restricts which Snowflake schemas may be targeted by resources
                  using this ProviderConfig. Entries use "DATABASE.SCHEMA" format for fully-qualified
                  matching, or just "SCHEMA" for name-only matching across all databases.
                  A list containing "*" means all schemas are allowed.
                  An empty list means all schemas are allowed.
                  Entries are matched case-insensitively.
                items:
                  type: string
                type: array
              authenticationType:
                description: AuthenticationType selects the authentication method.
                enum:
                - KeyPair
                - UsernamePassword
                - WorkloadIdentity
                type: string
              credentials:
                description: |-
                  Credentials references a Kubernetes Secret containing authentication material.
                  Required for KeyPair and UsernamePassword authentication.
                  Must not be set for WorkloadIdentity authentication.
                properties:
                  passphraseKey:
                    description: |-
                      PassphraseKey optionally specifies the key within the same Secret
                      (referenced by SecretRef) that contains the passphrase for an encrypted
                      PKCS#8 private key. Only valid with KeyPair authentication when the
                      private key is encrypted (PEM type "ENCRYPTED PRIVATE KEY").
                      The passphrase must be stored in the same Secret as the private key.
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references a Secret containing Snowflake credentials.
                      For KeyPair auth, the Secret must contain a PEM-encoded RSA private key.
                      For UsernamePassword auth, the Secret must contain a password.
                    properties:
                      key:
                        description: Key within the Secret data to select.
                        maxLength: 255
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Kubernetes Secret.
                        maxLength: 255
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Secret. Defaults to the namespace
                          of the referring resource.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              region:
                description: |-
                  Region is the Snowflake cloud region (e.g. "us-east-1", "eu-west-1").
                  Modern Snowflake account identifiers (orgname-accountname format) encode
                  the region, making this field optional. Legacy account identifiers (xy12345)
                  still require an explicit region.
                maxLength: 255
                type: string
              role:
                description: Role is the Snowflake role to assume. Defaults to the
                  user's default role.
                maxLength: 255
                type: string
              user:
                description: User is the Snowflake user for authentication.
                maxLength: 255
                minLength: 1
                type: string
              warehouse:
                description: Warehouse is the default warehouse for the session.
                maxLength: 255
                type: string
              workloadIdentity:
                description: |-
                  WorkloadIdentity configures Workload Identity Federation for passwordless authentication.
                  Required when authenticationType is set to WorkloadIdentity.
                properties:
                  audience:
                    description: |-
                      Audience is the intended audience for the projected ServiceAccount token.
                      This should match the audience configured in the Snowflake security integration.
                      Defaults to the Snowflake account URL if not set.
                    type: string
                  provider:
                    description: |-
                      Provider selects the cloud-specific WIF attestation provider.
                      "OIDC" uses projected ServiceAccount tokens (works on any cluster).
                      "AWS" uses IAM credentials from EKS IRSA or Pod Identity.
                      "GCP" uses GCE metadata service or service account impersonation.
                      "Azure" uses Azure IMDS or managed identity.
                      Defaults to "OIDC" if not set.
                    enum:
                    - OIDC
                    - AWS
                    - GCP
                    - Azure
                    - ""
                    type: string
                  tokenFilePath:
                    description: |-
                      TokenFilePath is the path to the projected ServiceAccount token file.
                      Only used when provider is "OIDC" (or empty, which defaults to OIDC).
                      Defaults to /var/run/secrets/snowflake/token if not set.
                      Must be under /var/run/secrets/ for security.
                    type: string
                type: object
            required:
            - account
            - user
            type: object
            x-kubernetes-validations:
            - message: spec.credentials.secretRef (name and key) is required for KeyPair
                authentication
              rule: self.authenticationType != 'KeyPair' || (has(self.credentials)
                && has(self.credentials.secretRef) && size(self.credentials.secretRef.name)
                > 0 && size(self.credentials.secretRef.key) > 0)
            - message: spec.credentials.secretRef (name and key) is required for UsernamePassword
                authentication
              rule: self.authenticationType != 'UsernamePassword' || (has(self.credentials)
                && has(self.credentials.secretRef) && size(self.credentials.secretRef.name)
                > 0 && size(self.credentials.secretRef.key) > 0)
            - message: spec.workloadIdentity is required for WorkloadIdentity authentication
              rule: self.authenticationType != 'WorkloadIdentity' || has(self.workloadIdentity)
            - message: spec.credentials.secretRef must not be set for WorkloadIdentity
                authentication
              rule: self.authenticationType != 'WorkloadIdentity' || !has(self.credentials)
                || !has(self.credentials.secretRef) || size(self.credentials.secretRef.name)
                == 0
            - message: spec.credentials.passphraseKey is only valid for KeyPair authentication
              rule: '!has(self.credentials) || !has(self.credentials.passphraseKey)
                || size(self.credentials.passphraseKey) == 0 || self.authenticationType
                == ''KeyPair'''
            - message: spec.account is immutable (changing would redirect to a different
                Snowflake account)
              rule: self.account == oldSelf.account
            - message: spec.user is immutable (changing would redirect to a different
                Snowflake user)
              rule: self.user == oldSelf.user
          status:
            description: ProviderConfigStatus defines the observed state of ProviderConfig.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ProviderConfig's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
