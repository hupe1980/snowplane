---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: schemas.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: Schema
    listKind: SchemaList
    plural: schemas
    shortNames:
    - sch
    singular: schema
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: SYNCED
      type: string
    - jsonPath: .spec.name
      name: SNOWFLAKE-NAME
      type: string
    - jsonPath: .status.databaseName
      name: DATABASE
      type: string
    - jsonPath: .spec.providerRef.name
      name: PROVIDER
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schema is the Schema for the schemas API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SchemaSpec defines the desired state of a Schema.
            properties:
              comment:
                description: Comment is an optional description for the schema.
                maxLength: 10000
                type: string
              dataRetentionTimeInDays:
                description: DataRetentionTimeInDays specifies the Time Travel retention
                  period (0–90 days).
                format: int32
                maximum: 90
                minimum: 0
                type: integer
              databaseName:
                description: |-
                  DatabaseName is the Snowflake database identifier (e.g. "ANALYTICS").
                  Use this when the database is NOT managed by Snowplane.
                  Mutually exclusive with DatabaseRef. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef references a Database CR in the same namespace.
                  Mutually exclusive with DatabaseName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              defaultDDLCollation:
                description: DefaultDDLCollation sets the default collation for string
                  columns.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              logLevel:
                description: LogLevel controls the logging verbosity.
                type: string
              managedAccess:
                description: |-
                  ManagedAccess enables managed access mode for the schema.
                  Set to true to enable, false to explicitly disable. Omit to leave unmanaged.
                type: boolean
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                  observeOnly:
                    description: |-
                      ObserveOnly puts the resource into read-only mode. When true the
                      controller will Observe the Snowflake resource and populate status
                      but will never issue CREATE, ALTER, or DROP statements. Deletion
                      of the CR removes the finalizer without dropping the Snowflake
                      resource. Defaults to false.
                    type: boolean
                type: object
              maxDataExtensionTimeInDays:
                description: |-
                  MaxDataExtensionTimeInDays specifies the maximum number of days Snowflake
                  can extend the data retention period.
                format: int32
                maximum: 90
                minimum: 0
                type: integer
              metricLevel:
                description: MetricLevel controls the metric collection level.
                type: string
              name:
                description: Name is the Snowflake schema name. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              replaceInvalidCharacters:
                description: ReplaceInvalidCharacters controls whether to replace
                  invalid UTF-8 characters.
                type: boolean
              storageSerializationPolicy:
                description: StorageSerializationPolicy controls storage serialization
                  format.
                type: string
              traceLevel:
                description: TraceLevel controls the trace collection level.
                type: string
              transient:
                default: false
                description: Transient indicates this is a transient schema (no Fail-safe).
                  Immutable after creation.
                type: boolean
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.transient is immutable (delete and recreate the resource
                to change)
              rule: self.transient == oldSelf.transient
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: spec.databaseName must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.databaseName) || !self.databaseName.contains(''.'')'
          status:
            description: SchemaStatus defines the observed state of a Schema.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseName:
                description: DatabaseName is the parent Snowflake database name.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              showOutput:
                description: ShowOutput contains the raw SHOW SCHEMAS output for this
                  schema.
                properties:
                  comment:
                    description: Comment is the schema description.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the schema was created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  kind:
                    description: Kind is the schema kind (STANDARD or TRANSIENT).
                    type: string
                  name:
                    description: Name is the schema name as returned by Snowflake.
                    type: string
                  options:
                    description: Options contains schema options (e.g. "MANAGED ACCESS").
                    type: string
                  owner:
                    description: Owner is the role that owns the schema.
                    type: string
                  retentionTime:
                    description: RetentionTime is the data retention time in days.
                    format: int32
                    type: integer
                type: object
              trackedParameters:
                description: |-
                  TrackedParameters tracks which optional spec fields have been actively SET
                  in Snowflake. When a previously-managed field is removed from the spec,
                  the reconciler issues ALTER ... UNSET to revert to the server default.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
