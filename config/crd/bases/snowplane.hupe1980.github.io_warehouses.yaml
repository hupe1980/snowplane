---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: warehouses.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: Warehouse
    listKind: WarehouseList
    plural: warehouses
    shortNames:
    - wh
    singular: warehouse
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: SYNCED
      type: string
    - jsonPath: .spec.name
      name: SNOWFLAKE-NAME
      type: string
    - jsonPath: .spec.warehouseSize
      name: SIZE
      type: string
    - jsonPath: .status.state
      name: STATE
      type: string
    - jsonPath: .spec.providerRef.name
      name: PROVIDER
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Warehouse is the Schema for the warehouses API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WarehouseSpec defines the desired state of a Warehouse.
            properties:
              autoResume:
                description: AutoResume controls whether the warehouse auto-resumes
                  on query.
                type: boolean
              autoSuspend:
                description: |-
                  AutoSuspend is the number of seconds of inactivity before auto-suspend.
                  Must be 0 (disable) or >= 60.
                format: int32
                minimum: 0
                type: integer
              comment:
                description: Comment is an optional description.
                maxLength: 10000
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              enableQueryAcceleration:
                description: EnableQueryAcceleration enables the query acceleration
                  service.
                type: boolean
              generation:
                description: |-
                  Generation specifies the warehouse generation for standard warehouses.
                  Valid values are "1" (gen1) or "2" (gen2). This is a simplified alternative
                  to using ResourceConstraint for generation selection.
                enum:
                - "1"
                - "2"
                type: string
              initiallySuspended:
                description: |-
                  InitiallySuspended creates the warehouse in a suspended state.
                  This is a CREATE-only field and is not applied on updates.
                type: boolean
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                  observeOnly:
                    description: |-
                      ObserveOnly puts the resource into read-only mode. When true the
                      controller will Observe the Snowflake resource and populate status
                      but will never issue CREATE, ALTER, or DROP statements. Deletion
                      of the CR removes the finalizer without dropping the Snowflake
                      resource. Defaults to false.
                    type: boolean
                type: object
              maxClusterCount:
                description: MaxClusterCount is the maximum number of clusters (multi-cluster
                  mode).
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              maxConcurrencyLevel:
                description: MaxConcurrencyLevel limits concurrent queries (1–32,
                  default 8).
                format: int32
                maximum: 32
                minimum: 1
                type: integer
              minClusterCount:
                description: MinClusterCount is the minimum number of clusters (multi-cluster
                  mode).
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              name:
                description: Name is the Snowflake warehouse name. Immutable after
                  creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              queryAccelerationMaxScaleFactor:
                description: QueryAccelerationMaxScaleFactor limits query acceleration
                  scaling (0–100).
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              resourceConstraint:
                description: ResourceConstraint specifies resource constraints (e.g.,
                  MEMORY, STANDARD_GEN_1, MEMORY_16X).
                enum:
                - MEMORY
                - STANDARD_GEN_1
                - STANDARD_GEN_2
                - MEMORY_1X
                - MEMORY_1X_x86
                - MEMORY_16X
                - MEMORY_16X_x86
                - MEMORY_64X
                - MEMORY_64X_x86
                type: string
              resourceMonitor:
                description: ResourceMonitor is the name of the resource monitor to
                  attach.
                type: string
              scalingPolicy:
                description: ScalingPolicy controls multi-cluster scaling behavior.
                enum:
                - STANDARD
                - ECONOMY
                type: string
              statementQueuedTimeoutInSeconds:
                description: StatementQueuedTimeoutInSeconds controls how long queries
                  queue before timing out.
                format: int32
                minimum: 0
                type: integer
              statementTimeoutInSeconds:
                description: StatementTimeoutInSeconds controls the max execution
                  time per statement.
                format: int32
                minimum: 0
                type: integer
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
              warehouseSize:
                description: WarehouseSize specifies the compute size.
                enum:
                - XSMALL
                - SMALL
                - MEDIUM
                - LARGE
                - XLARGE
                - 2XLARGE
                - 3XLARGE
                - 4XLARGE
                - 5XLARGE
                - 6XLARGE
                type: string
              warehouseType:
                description: |-
                  WarehouseType specifies the warehouse type (STANDARD or SNOWPARK-OPTIMIZED).
                  Mutable — Snowflake supports changing warehouse type on a running warehouse.
                enum:
                - STANDARD
                - SNOWPARK-OPTIMIZED
                type: string
            required:
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: spec.generation and spec.resourceConstraint are mutually exclusive
              rule: '!(has(self.generation) && has(self.resourceConstraint))'
            - message: spec.autoSuspend must be 0 (disable) or >= 60 seconds
              rule: '!has(self.autoSuspend) || self.autoSuspend == 0 || self.autoSuspend
                >= 60'
            - message: spec.name must not contain dots (dots break fully qualified
                name resolution)
              rule: '!self.name.contains(''.'')'
          status:
            description: WarehouseStatus defines the observed state of a Warehouse.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedGeneration:
                description: |-
                  LastAppliedGeneration stores the last generation value applied to
                  Snowflake. Like ResourceConstraint, SHOW WAREHOUSES does not surface
                  this field, so we track it to prevent redundant ALTERs.
                type: string
              lastAppliedResourceConstraint:
                description: |-
                  LastAppliedResourceConstraint stores the last resource constraint value
                  applied to Snowflake. Because SHOW WAREHOUSES does not surface this
                  field, tracking it prevents unnecessary ALTER on every reconcile.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              showOutput:
                description: ShowOutput stores the last observed SHOW WAREHOUSES output.
                properties:
                  autoResume:
                    type: boolean
                  autoSuspend:
                    format: int32
                    type: integer
                  comment:
                    type: string
                  createdOn:
                    type: string
                  maxClusterCount:
                    format: int32
                    type: integer
                  minClusterCount:
                    format: int32
                    type: integer
                  name:
                    type: string
                  owner:
                    type: string
                  resourceMonitor:
                    type: string
                  scalingPolicy:
                    type: string
                  size:
                    type: string
                  state:
                    type: string
                  type:
                    type: string
                type: object
              state:
                description: State is the current running state (STARTED, SUSPENDED,
                  RESIZING).
                type: string
              trackedParameters:
                description: TrackedParameters tracks which Snowflake parameters are
                  actively managed.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
