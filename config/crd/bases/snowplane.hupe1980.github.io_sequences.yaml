    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sequence is the Schema for the sequences API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SequenceSpec defines the desired state of a Snowflake sequence.
            properties:
              comment:
                description: Comment is an optional description for the sequence.
                type: string
              databaseName:
                description: |-
                  DatabaseName is the literal Snowflake database name.
                  Mutually exclusive with DatabaseRef.
                type: string
              databaseRef:
                description: |-
                  DatabaseRef is a reference to a Database resource in the same namespace.
                  Mutually exclusive with DatabaseName.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
