                  databaseName:
                    description: DatabaseName is the database containing the sequence.
                    type: string
                  interval:
                    description: Interval is the increment interval.
                    type: string
                  name:
                    description: Name is the Snowflake name of the sequence.
                    type: string
                  nextValue:
                    description: NextValue is the next value to be generated.
                    type: string
                  ordering:
                    description: Ordering is ORDER or NOORDER.
                    type: string
                  owner:
                    description: Owner is the role that owns the sequence.
