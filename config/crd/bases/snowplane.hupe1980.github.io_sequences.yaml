                  SchemaName is the literal Snowflake schema name.
                  Mutually exclusive with SchemaRef.
                type: string
              schemaRef:
                description: |-
                  SchemaRef is a reference to a Schema resource in the same namespace.
                  Mutually exclusive with SchemaName.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              start:
                description: |-
                  Start is the initial value for the sequence. Immutable after creation.
                  Defaults to 1 if not specified.
                format: int64
                type: integer
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
