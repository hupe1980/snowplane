    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ExternalTable is the Schema for the external tables API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExternalTableSpec defines the desired state of a Snowflake
              external table.
            properties:
              autoRefresh:
                description: |-
                  AutoRefresh controls whether Snowflake automatically refreshes the external
                  table metadata when new or updated data files are available.
                  This is the only mutable field after creation.
                type: boolean
              awsSnsTopic:
                description: |-
                  AwsSnsTopic is the Amazon SNS topic ARN for automatic refresh on S3.
                  Immutable after creation.
                type: string
              columns:
                description: |-
                  Columns defines the external table's virtual column definitions.
                  Each column specifies a name, type, and an AS expression that derives
                  the column value from the staged data (VALUE variant or METADATA$FILENAME).
                  Immutable after creation.
                items:
                  description: ExternalTableColumnDefinition describes a column in
                    a Snowflake external table.
                  properties:
                    as:
                      description: |-
                        As is the SQL expression for the column value.
                        For regular columns, reference the VALUE variant (e.g. "value:col1::varchar").
                        For partition columns, use METADATA$FILENAME or METADATA$EXTERNAL_TABLE_PARTITION.
                      maxLength: 255
                      minLength: 1
                      type: string
                    name:
                      description: Name is the column identifier.
                      maxLength: 255
                      minLength: 1
                      type: string
                    type:
                      description: Type is the Snowflake data type (e.g. VARCHAR,
                        NUMBER, TIMESTAMP_NTZ).
                      maxLength: 255
                      minLength: 1
                      type: string
                  required:
                  - as
                  - name
                  - type
                  type: object
                type: array
              comment:
                description: |-
                  Comment is an optional description for the external table.
                  Immutable after creation (ALTER EXTERNAL TABLE does not support SET COMMENT).
                type: string
              databaseName:
                description: |-
                  DatabaseName is the Snowflake database identifier (e.g. "ANALYTICS").
                  Use this when the database is NOT managed by Snowplane.
                  Mutually exclusive with DatabaseRef. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef references a Database CR in the same namespace.
                  Mutually exclusive with DatabaseName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              fileFormat:
                description: |-
                  FileFormat specifies the file format specification.
                  Examples: "TYPE = PARQUET", "TYPE = CSV FIELD_DELIMITER = '|'", "FORMAT_NAME = 'my_format'".
                  Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              integration:
                description: |-
                  Integration specifies the notification integration name for GCS or Azure auto-refresh.
                  Immutable after creation.
                type: string
              location:
                description: |-
                  Location specifies the external stage and optional path (e.g. "@MYDB.MYSCHEMA.MYSTAGE/path/").
                  Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                type: object
              name:
                description: Name is the Snowflake external table name. Immutable
                  after creation.
                maxLength: 255
                minLength: 1
                type: string
              partitionBy:
                description: |-
                  PartitionBy specifies one or more partition column names defined in Columns.
                  Immutable after creation.
                items:
                  type: string
                type: array
              partitionType:
                description: |-
                  PartitionType specifies the partition type.
                  Set to "USER_SPECIFIED" for manually managed partitions.
                  Immutable after creation.
                enum:
                - USER_SPECIFIED
                type: string
              pattern:
                description: |-
                  Pattern is a regular expression pattern to match filenames in the stage location.
                  Immutable after creation.
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              refreshOnCreate:
                description: |-
                  RefreshOnCreate controls whether the external table metadata is automatically
                  refreshed once immediately after creation. Defaults to true in Snowflake.
                  Immutable after creation.
                type: boolean
              schemaName:
                description: |-
                  SchemaName is the Snowflake schema identifier (e.g. "PUBLIC").
                  Use this when the schema is NOT managed by Snowplane.
                  Mutually exclusive with SchemaRef. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              schemaRef:
                description: |-
                  SchemaRef references a Schema CR in the same namespace.
                  Mutually exclusive with SchemaName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              tableFormat:
                description: |-
                  TableFormat identifies the external table format.
                  Set to "DELTA" for Delta Lake tables.
                  Immutable after creation.
                enum:
                - DELTA
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - fileFormat
            - location
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.schemaRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaRef) == has(self.schemaRef) && (!has(self.schemaRef)
                || self.schemaRef == oldSelf.schemaRef)
            - message: spec.schemaName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaName) == has(self.schemaName) && (!has(self.schemaName)
                || self.schemaName == oldSelf.schemaName)
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: exactly one of spec.schemaRef or spec.schemaName must be set
              rule: (has(self.schemaRef) && !has(self.schemaName)) || (!has(self.schemaRef)
                && has(self.schemaName))
            - message: spec.databaseName must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.databaseName) || !self.databaseName.contains(''.'')'
            - message: spec.schemaName must be a simple identifier, not a fully-qualified
                name; use spec.databaseName for the database part
              rule: '!has(self.schemaName) || !self.schemaName.contains(''.'')'
            - message: spec.location is immutable (delete and recreate the resource
                to change)
              rule: self.location == oldSelf.location
            - message: spec.fileFormat is immutable (delete and recreate the resource
                to change)
              rule: self.fileFormat == oldSelf.fileFormat
            - message: spec.columns is immutable (delete and recreate the resource
                to change)
              rule: '!has(oldSelf.columns) || !has(self.columns) || self.columns ==
                oldSelf.columns'
            - message: spec.partitionBy is immutable (delete and recreate the resource
                to change)
              rule: '!has(oldSelf.partitionBy) || !has(self.partitionBy) || self.partitionBy
                == oldSelf.partitionBy'
            - message: spec.partitionType is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.partitionType) == has(self.partitionType) && (!has(self.partitionType)
                || self.partitionType == oldSelf.partitionType)
            - message: spec.pattern is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.pattern) == has(self.pattern) && (!has(self.pattern)
                || self.pattern == oldSelf.pattern)
            - message: spec.refreshOnCreate is immutable (delete and recreate the
                resource to change)
              rule: has(oldSelf.refreshOnCreate) == has(self.refreshOnCreate) && (!has(self.refreshOnCreate)
                || self.refreshOnCreate == oldSelf.refreshOnCreate)
            - message: spec.awsSnsTopic is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.awsSnsTopic) == has(self.awsSnsTopic) && (!has(self.awsSnsTopic)
                || self.awsSnsTopic == oldSelf.awsSnsTopic)
            - message: spec.tableFormat is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.tableFormat) == has(self.tableFormat) && (!has(self.tableFormat)
                || self.tableFormat == oldSelf.tableFormat)
            - message: spec.integration is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.integration) == has(self.integration) && (!has(self.integration)
                || self.integration == oldSelf.integration)
            - message: spec.comment is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.comment) == has(self.comment) && (!has(self.comment)
                || self.comment == oldSelf.comment)
          status:
            description: ExternalTableStatus defines the observed state of ExternalTable.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseName:
                description: DatabaseName is the resolved Snowflake database name.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              schemaName:
                description: SchemaName is the resolved Snowflake schema name.
                type: string
              showOutput:
                description: ShowOutput contains the raw SHOW EXTERNAL TABLES output
                  for this table.
                properties:
                  cloud:
                    description: Cloud is the cloud provider where staged data files
                      are located.
                    type: string
                  comment:
                    description: Comment is the external table description.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the external table
                      was created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  fileFormatName:
                    description: FileFormatName is the named file format in the external
                      table definition.
                    type: string
                  fileFormatType:
                    description: FileFormatType is the file format type (CSV, JSON,
                      PARQUET, etc.).
                    type: string
                  invalid:
                    description: Invalid indicates whether the referenced stage or
                      file format is dropped.
                    type: string
                  invalidReason:
                    description: InvalidReason provides the reason when the external
                      table is invalid.
                    type: string
                  lastRefreshDetails:
                    description: LastRefreshDetails contains diagnostic information
                      about the last metadata refresh.
                    type: string
                  lastRefreshedOn:
                    description: LastRefreshedOn is the timestamp of the last metadata
                      refresh.
                    type: string
                  location:
                    description: Location is the external stage and folder path.
                    type: string
                  name:
                    description: Name is the external table name as returned by Snowflake.
                    type: string
                  notificationChannel:
                    description: NotificationChannel is the notification channel ARN/name.
                    type: string
                  owner:
                    description: Owner is the role that owns the external table.
                    type: string
                  ownerRoleType:
                    description: OwnerRoleType is the type of role that owns the object.
                    type: string
                  region:
                    description: Region is the cloud region.
                    type: string
                  schemaName:
                    description: SchemaName is the parent schema name.
                    type: string
                  stage:
                    description: Stage is the fully qualified name of the referenced
                      stage.
                    type: string
                  tableFormat:
                    description: TableFormat is the table format (e.g. DELTA, UNSPECIFIED).
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters lists the spec fields the controller
                  is tracking.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
