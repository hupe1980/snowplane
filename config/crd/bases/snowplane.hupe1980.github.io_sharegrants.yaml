              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ShareGrantSpec defines the desired state of a ShareGrant.
              Share grants are simpler than role grants: they only support specific named
              objects (no ALL/FUTURE bulk grants) and do not support WITH GRANT OPTION.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              objectName:
