                                type: string
                            required:
                            - name
                            type: object
                          inSchema:
                            description: InSchema scopes the grant to all objects
                              of the type in the specified schema.
                            type: string
                          inSchemaRef:
                            description: |-
                              InSchemaRef references a Schema CR.
                              Mutually exclusive with InSchema.
                            properties:
                              name:
                                description: Name of the referent.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          objectTypePlural:
                            description: ObjectTypePlural is the plural form of the
