    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DatabaseRoleGrant is the Schema for the databaserolegrants API.
          It grants a Snowflake privilege to a database role.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DatabaseRoleGrantSpec defines the desired state of a DatabaseRoleGrant.
              All grant fields are immutable after creation — changing any field requires
              a REVOKE + re-GRANT (delete and recreate the resource to change).
            properties:
              databaseRole:
                description: |-
                  DatabaseRole is the fully qualified database role name (e.g. MY_DB.MY_ROLE).
                  Mutually exclusive with DatabaseRoleRef.
                type: string
              databaseRoleRef:
                description: |-
                  DatabaseRoleRef references a DatabaseRole CR in the same namespace.
                  When set, the database role name is resolved from the CR's fullyQualifiedName.
                  Mutually exclusive with DatabaseRole.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              "on":
                description: |-
                  On defines what the privilege is granted on.
                  Exactly one variant must be set.
                properties:
                  account:
                    description: |-
                      Account grants a global account-level privilege (e.g. CREATE DATABASE, MANAGE GRANTS).
                      Set to true for ON ACCOUNT.
                    type: boolean
                  accountObject:
                    description: |-
                      AccountObject grants a privilege on an account-level object
                      (DATABASE, WAREHOUSE, USER, RESOURCE MONITOR, etc.).
                    properties:
                      objectName:
                        description: ObjectName is the identifier of the object.
                        type: string
                      objectType:
                        description: |-
                          ObjectType is the type of the account object.
                          Valid values: USER, RESOURCE MONITOR, WAREHOUSE, COMPUTE POOL, DATABASE,
                          INTEGRATION, CONNECTION, FAILOVER GROUP, REPLICATION GROUP, EXTERNAL VOLUME.
                        type: string
                    required:
                    - objectName
                    - objectType
                    type: object
                  schema:
                    description: Schema grants a privilege on a schema or on all/future
                      schemas in a database.
                    properties:
                      allInDatabase:
                        description: |-
                          AllInDatabase grants on all existing schemas in the specified database.
                          For: ON ALL SCHEMAS IN DATABASE <db_name>
                        type: string
                      allInDatabaseRef:
                        description: |-
                          AllInDatabaseRef references a Database CR for the ALL SCHEMAS IN DATABASE grant.
                          Mutually exclusive with AllInDatabase.
                        properties:
                          name:
                            description: Name of the referent.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      futureInDatabase:
                        description: |-
                          FutureInDatabase grants on future schemas in the specified database.
                          For: ON FUTURE SCHEMAS IN DATABASE <db_name>
                        type: string
                      futureInDatabaseRef:
                        description: |-
                          FutureInDatabaseRef references a Database CR for the FUTURE SCHEMAS IN DATABASE grant.
                          Mutually exclusive with FutureInDatabase.
                        properties:
                          name:
                            description: Name of the referent.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      schemaName:
                        description: |-
                          SchemaName is the fully qualified schema name (e.g. "MY_DB"."PUBLIC").
                          For: ON SCHEMA <schema_name>
                        type: string
                      schemaRef:
                        description: |-
                          SchemaRef references a Schema CR in the same namespace.
                          When set, the schema FQN is resolved from the CR's fullyQualifiedName.
                          Mutually exclusive with SchemaName.
                        properties:
                          name:
                            description: Name of the referent.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  schemaObject:
                    description: |-
                      SchemaObject grants a privilege on a specific schema object, or on
                      all/future schema objects of a given type in a database or schema.
                    properties:
                      all:
                        description: |-
                          All specifies granting on all existing objects of a given type.
                          For: ON ALL <type_plural> IN {DATABASE <db> | SCHEMA <schema>}
                        properties:
                          inDatabase:
                            description: InDatabase scopes the grant to all objects
                              of the type in the specified database.
                            type: string
                          inDatabaseRef:
                            description: |-
