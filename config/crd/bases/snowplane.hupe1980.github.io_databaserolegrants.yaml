            - message: spec.withGrantOption is immutable (delete and recreate the
                resource to change)
              rule: self.withGrantOption == oldSelf.withGrantOption
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
