                            properties:
                              name:
                                description: Name of the referent.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          inSchema:
                            description: InSchema scopes the grant to all objects
                              of the type in the specified schema.
                            type: string
                          inSchemaRef:
                            description: |-
                              InSchemaRef references a Schema CR.
                              Mutually exclusive with InSchema.
                            properties:
                              name:
                                description: Name of the referent.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          objectTypePlural:
                            description: ObjectTypePlural is the plural form of the
                              object type (e.g. TABLES, VIEWS, STAGES).
                            type: string
                        required:
                        - objectTypePlural
                        type: object
                      objectName:
                        description: |-
                          ObjectName is the fully qualified name of the specific object.
                          Required when granting on a specific object.
                        type: string
                      objectType:
                        description: |-
                          ObjectType is the schema object type (e.g. TABLE, VIEW, STAGE, FUNCTION, PROCEDURE, STREAM, TASK, PIPE).
                          Required when granting on a specific object.
                        type: string
                    type: object
                type: object
              privilege:
                description: Privilege is the Snowflake privilege to grant (e.g. USAGE,
                  SELECT, CREATE TABLE).
                minLength: 1
                type: string
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
              withGrantOption:
                default: false
                description: WithGrantOption allows the grantee to re-grant the privilege
                  to other roles.
                type: boolean
