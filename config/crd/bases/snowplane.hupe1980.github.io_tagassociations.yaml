    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TagAssociation is the Schema for the tagassociations API.
          It associates a Snowflake tag with an object, setting a tag value.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "TagAssociationSpec defines the desired state of a TagAssociation.\nAssociates
              a Snowflake tag with an object:\n\n\tALTER <object_type> <object_name>
              SET TAG <tag_name> = '<tag_value>'\n\nIdentity fields (tagName/tagRef,
              objectType, objectName) are immutable\nafter creation — changing any
              of them requires deleting and recreating\nthe resource. Only tagValue
              may be updated in place.\n\nMutual exclusivity rules:"
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                type: object
              objectName:
                description: |-
                  ObjectName is the fully qualified Snowflake object name to tag
                  (e.g. "MY_DB"."MY_SCHEMA"."MY_TABLE").
                  Immutable after creation.
                minLength: 1
                type: string
              objectType:
                description: ObjectType is the Snowflake object type to tag (e.g.
                  "TABLE", "WAREHOUSE", "DATABASE").
                enum:
                - ACCOUNT
                - DATABASE
                - SCHEMA
                - TABLE
                - VIEW
                - COLUMN
                - WAREHOUSE
                - ROLE
                - USER
                - STAGE
                - STREAM
                - TASK
                - ALERT
                - PIPE
                - FUNCTION
                - PROCEDURE
                - INTEGRATION
                - NETWORK POLICY
                - DATABASE ROLE
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              tagName:
                description: |-
                  TagName is the fully qualified tag name (e.g. "MY_DB"."MY_SCHEMA"."MY_TAG").
                  Mutually exclusive with TagRef.
                type: string
              tagRef:
                description: |-
                  TagRef references a Tag CR in the same namespace.
                  When set, the tag name is resolved from the CR's fullyQualifiedName.
                  Mutually exclusive with TagName.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tagValue:
                description: |-
                  TagValue is the string value to assign to the tag on the object.
                  This is the only mutable field — changing it triggers an ALTER SET TAG
                  with the new value.
                maxLength: 256
                minLength: 1
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
            required:
            - objectName
            - objectType
            - providerRef
            - tagValue
            type: object
            x-kubernetes-validations:
            - message: spec.tagName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.tagName) == has(self.tagName) && (!has(self.tagName)
                || self.tagName == oldSelf.tagName)
            - message: spec.tagRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.tagRef) == has(self.tagRef) && (!has(self.tagRef)
                || self.tagRef == oldSelf.tagRef)
            - message: spec.objectType is immutable (delete and recreate the resource
                to change)
              rule: self.objectType == oldSelf.objectType
            - message: spec.objectName is immutable (delete and recreate the resource
                to change)
              rule: self.objectName == oldSelf.objectName
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.tagName or spec.tagRef must be set
              rule: '(has(self.tagName) ? 1 : 0) + (has(self.tagRef) ? 1 : 0) ==
                1'
          status:
            description: TagAssociationStatus defines the observed state of a TagAssociation.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              observedValue:
                description: ObservedValue contains the tag value observed from Snowflake.
                properties:
                  tagValue:
                    description: |-
                      TagValue is the tag value currently set on the object in Snowflake,
                      as returned by SYSTEM$GET_TAG.
                    type: string
                type: object
              tagName:
                description: TagName is the resolved fully qualified tag name.
                type: string
            type: object
        type: object
