                    type: string
                  usedCredits:
                    description: UsedCredits is the credits used in the current interval.
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters tracks which optional spec fields have
                  been actively SET.
                items:
                  type: string
                type: array
            type: object
        type: object
