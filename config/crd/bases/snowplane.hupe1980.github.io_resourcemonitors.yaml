    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ResourceMonitor is the Schema for the resourcemonitors API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ResourceMonitorSpec defines the desired state of a Snowflake
              Resource Monitor.
            properties:
              creditQuota:
                description: CreditQuota is the number of credits allocated per frequency
                  interval.
                format: int32
                type: integer
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              endTimestamp:
                description: EndTimestamp is the date/time when the monitor suspends
                  assigned warehouses.
                type: string
              frequency:
                description: |-
                  Frequency is the interval at which credit usage resets to 0.
                  If set, startTimestamp must also be set.
                enum:
                - MONTHLY
                - DAILY
                - WEEKLY
                - YEARLY
                - NEVER
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                type: object
              name:
                description: Name is the Snowflake resource monitor name. Immutable
                  after creation.
                minLength: 1
                type: string
              notifyUsers:
                description: NotifyUsers is the list of users to receive email notifications.
                items:
                  type: string
                type: array
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              startTimestamp:
                description: |-
                  StartTimestamp is the date/time when monitoring begins. Use "IMMEDIATELY" for now.
                  If set, frequency must also be set.
                type: string
              triggers:
                description: |-
                  Triggers defines the trigger thresholds and actions for the resource monitor.
                  Each resource monitor supports up to 5 NOTIFY triggers.
                items:
                  description: ResourceMonitorTrigger defines a trigger for the resource
                    monitor.
                  properties:
                    action:
                      description: Action is the action to perform when the threshold
                        is reached.
                      enum:
                      - SUSPEND
                      - SUSPEND_IMMEDIATE
                      - NOTIFY
                      type: string
                    threshold:
                      description: |-
                        Threshold is the percentage of the credit quota that triggers the action.
                        Values larger than 100 are supported.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - action
                  - threshold
                  type: object
                type: array
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
            required:
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
