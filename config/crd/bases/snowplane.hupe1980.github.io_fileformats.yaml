    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FileFormat is the Schema for the fileformats API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FileFormatSpec defines the desired state of a Snowflake File
              Format.
            properties:
              allowDuplicate:
                description: AllowDuplicate allows duplicate object field names in
                  JSON (JSON only).
                type: boolean
              binaryAsText:
                description: BinaryAsText interprets Parquet BINARY columns as text
                  (Parquet only).
                type: boolean
              binaryFormat:
                description: BinaryFormat specifies the encoding format for binary
                  input/output (CSV/JSON).
                enum:
                - HEX
                - BASE64
                - UTF8
                type: string
              comment:
                description: Comment is an optional description for the file format.
                type: string
              compression:
                description: Compression specifies the compression algorithm.
                enum:
                - AUTO
                - GZIP
                - BZ2
                - BROTLI
                - ZSTD
                - DEFLATE
                - RAW_DEFLATE
                - NONE
                type: string
              databaseName:
                description: |-
                  DatabaseName is the raw Snowflake database identifier.
                  Mutually exclusive with DatabaseRef. Immutable after creation.
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef references a Database CR in the same namespace.
                  Mutually exclusive with DatabaseName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              dateFormat:
                description: DateFormat specifies the format for date values (CSV/JSON).
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              disableAutoConvert:
                description: DisableAutoConvert disables automatic conversion of numeric/boolean
                  strings (XML only).
                type: boolean
              disableSnowflakeData:
                description: DisableSnowflakeData disables Snowflake semi-structured
                  data parsing (JSON only).
                type: boolean
              emptyFieldAsNull:
                description: EmptyFieldAsNull specifies whether to treat empty fields
                  as NULL (CSV only).
                type: boolean
              enableOctal:
                description: EnableOctal enables parsing of octal number strings (JSON
                  only).
                type: boolean
              encoding:
                description: |-
                  Encoding specifies the character set encoding of the source data (CSV only).
                  Examples: "UTF-8", "UTF-16", "WINDOWS-1252"
                type: string
              errorOnColumnCountMismatch:
                description: ErrorOnColumnCountMismatch aborts if the number of columns
                  doesn't match (CSV only).
                type: boolean
              escape:
                description: Escape specifies the escape character for enclosed fields
                  (CSV only).
                type: string
              escapeUnenclosedField:
                description: EscapeUnenclosedField specifies the escape character
                  for unenclosed fields (CSV only).
                type: string
              fieldDelimiter:
                description: FieldDelimiter specifies the character used to separate
                  fields (CSV only).
                type: string
              fieldOptionallyEnclosedBy:
                description: FieldOptionallyEnclosedBy specifies the character used
                  to enclose strings (CSV only).
                type: string
              ignoreUtf8Errors:
                description: IgnoreUtf8Errors ignores UTF-8 encoding errors (CSV/JSON/XML).
                type: boolean
              name:
                description: Name is the Snowflake file format name. Immutable after
                  creation.
                minLength: 1
                type: string
              nullIf:
                description: NullIf specifies strings that represent NULL values (CSV/JSON).
                items:
                  type: string
                type: array
              parseHeader:
                description: ParseHeader determines whether to use the first row as
                  column names (CSV only).
                type: boolean
              preserveSpace:
                description: PreserveSpace preserves leading/trailing whitespace in
                  XML (XML only).
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              recordDelimiter:
                description: RecordDelimiter specifies the character used to separate
                  records (CSV only).
                type: string
              replaceInvalidCharacters:
                description: |-
                  ReplaceInvalidCharacters replaces invalid UTF-8 characters with the
                  Unicode replacement character (all formats).
                type: boolean
              schemaName:
                description: |-
                  SchemaName is the raw Snowflake schema FQN.
                  Mutually exclusive with SchemaRef. Immutable after creation.
                minLength: 1
                type: string
              schemaRef:
                description: |-
                  SchemaRef references a Schema CR in the same namespace.
                  Mutually exclusive with SchemaName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              skipBlankLines:
                description: SkipBlankLines skips blank lines in CSV data (CSV only).
                type: boolean
              skipByteOrderMark:
                description: SkipByteOrderMark skips the BOM character at the start
                  (CSV/JSON).
                type: boolean
              skipHeader:
                description: SkipHeader specifies the number of lines to skip at the
                  start (CSV only).
                format: int32
                type: integer
              snappyCompression:
                description: SnappyCompression uses Snappy compression for Parquet
                  output (Parquet only).
                type: boolean
              stripNullValues:
                description: StripNullValues removes key-value pairs with null values
                  (JSON only).
                type: boolean
              stripOuterArray:
                description: StripOuterArray removes outer brackets from JSON arrays
                  (JSON only).
                type: boolean
              stripOuterElement:
                description: StripOuterElement strips the outer XML element (XML only).
                type: boolean
              timeFormat:
                description: TimeFormat specifies the format for time values (CSV/JSON).
                type: string
              timestampFormat:
                description: TimestampFormat specifies the format for timestamp values
                  (CSV/JSON).
                type: string
              trimSpace:
                description: TrimSpace removes leading/trailing whitespace from string
                  values.
                type: boolean
              type:
                description: Type specifies the file format type. Immutable after
                  creation.
                enum:
                - CSV
                - JSON
                - AVRO
                - ORC
                - PARQUET
                - XML
                type: string
              useLogicalType:
                description: UseLogicalType instructs use of Parquet logical types
                  (Parquet only).
                type: boolean
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
            required:
            - name
            - providerRef
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.schemaRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaRef) == has(self.schemaRef) && (!has(self.schemaRef)
                || self.schemaRef == oldSelf.schemaRef)
            - message: spec.schemaName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaName) == has(self.schemaName) && (!has(self.schemaName)
                || self.schemaName == oldSelf.schemaName)
            - message: spec.type is immutable (delete and recreate the resource to
                change)
              rule: self.type == oldSelf.type
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: exactly one of spec.schemaRef or spec.schemaName must be set
              rule: (has(self.schemaRef) && !has(self.schemaName)) || (!has(self.schemaRef)
                && has(self.schemaName))
          status:
            description: FileFormatStatus defines the observed state of a FileFormat.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              databaseName:
                description: DatabaseName is the parent Snowflake database name.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              schemaName:
                description: SchemaName is the parent Snowflake schema name.
                type: string
              showOutput:
                description: ShowOutput contains the raw SHOW FILE FORMATS output
                  for this file format.
                properties:
                  comment:
                    description: Comment is the file format description.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the file format was
                      created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  name:
                    description: Name is the file format name as returned by Snowflake.
                    type: string
                  owner:
                    description: Owner is the role that owns the file format.
                    type: string
                  schemaName:
                    description: SchemaName is the parent schema name.
                    type: string
                  type:
                    description: Type is the file format type (CSV, JSON, etc.).
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters tracks which optional spec fields have
                  been actively SET.
                items:
                  type: string
                type: array
            type: object
