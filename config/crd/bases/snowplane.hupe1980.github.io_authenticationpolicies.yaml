            properties:
              authenticationMethods:
                description: |-
                  AuthenticationMethods is the list of authentication methods allowed.
                  Valid values include: ALL, SAML, PASSWORD, OAUTH, KEYPAIR, PROGRAMMATIC_ACCESS_TOKEN, WORKLOAD_IDENTITY.
