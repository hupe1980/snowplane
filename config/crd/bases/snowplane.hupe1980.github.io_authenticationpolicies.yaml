                    format: int32
                    minimum: 1
                    type: integer
                  maxExpiryInDays:
                    description: MaxExpiryInDays is the maximum token expiry in days.
                    format: int32
                    minimum: 1
                    type: integer
                  networkPolicyEvaluation:
                    description: |-
                      NetworkPolicyEvaluation controls whether the network policy is evaluated
                      for PAT-based authentication. Valid values: "OPTIONAL", "REQUIRED".
