                      type: string
                    type: array
                  enforceMfaOnExternalAuthentication:
                    description: |-
                      EnforceMfaOnExternalAuthentication controls MFA for external auth.
                      Valid values: "OPTIONAL", "REQUIRED".
                    enum:
