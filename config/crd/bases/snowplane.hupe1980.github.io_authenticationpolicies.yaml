              mfaEnrollment:
                description: |-
                  MfaEnrollment controls MFA enrollment behavior.
                  Valid values: REQUIRED, REQUIRED_PASSWORD_ONLY, OPTIONAL.
                enum:
                - REQUIRED
                - REQUIRED_PASSWORD_ONLY
                - OPTIONAL
                type: string
              mfaPolicy:
                description: MfaPolicy configures multi-factor authentication sub-policy.
                properties:
                  allowedMethods:
                    description: AllowedMethods is the list of MFA methods allowed
