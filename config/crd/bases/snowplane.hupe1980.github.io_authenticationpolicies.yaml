                    type: string
                  databaseName:
                    description: DatabaseName is the database containing the policy.
                    type: string
                  name:
                    description: Name is the policy name as returned by Snowflake.
                    type: string
                  owner:
                    description: Owner is the role that owns the policy.
                    type: string
                  schemaName:
                    description: SchemaName is the schema containing the policy.
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters tracks which optional spec fields have
                  been actively SET.
                items:
                  type: string
                type: array
            type: object
