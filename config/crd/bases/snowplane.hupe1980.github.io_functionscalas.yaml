---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: functionscalas.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: FunctionScala
    listKind: FunctionScalaList
    plural: functionscalas
    shortNames:
    - fnscala
    singular: functionscala
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: SYNCED
      type: string
    - jsonPath: .spec.name
      name: SNOWFLAKE-NAME
      type: string
    - jsonPath: .status.databaseName
      name: DATABASE
      type: string
    - jsonPath: .status.schemaName
      name: SCHEMA
      type: string
    - jsonPath: .spec.providerRef.name
      name: PROVIDER
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FunctionScala is the Schema for Scala user-defined functions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FunctionScalaSpec defines the desired state of a Snowflake
              Scala User-Defined Function.
            properties:
              arguments:
                description: Arguments defines the function arguments. Immutable after
                  creation.
                items:
                  description: CallableArgument defines an argument in a stored procedure
                    or function signature.
                  properties:
                    defaultValue:
                      description: |-
                        DefaultValue is the optional default value for the argument.
                        For text values use single quotes. Numeric values can be unquoted.
                      type: string
                    name:
                      description: Name is the argument name.
                      maxLength: 255
                      minLength: 1
                      type: string
                    type:
                      description: Type is the Snowflake data type (e.g. VARCHAR,
                        NUMBER, TIMESTAMP_NTZ).
                      maxLength: 255
                      minLength: 1
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              body:
                description: |-
                  Body is the inline Scala source code.
                  Optional — code can be deployed via stage imports instead.
                type: string
              comment:
                description: Comment is an optional description for the function.
                maxLength: 10000
                type: string
              databaseName:
                description: DatabaseName is the Snowflake database identifier (e.g.
                  "ANALYTICS").
                maxLength: 255
                minLength: 1
                type: string
              databaseRef:
                description: DatabaseRef references a Database CR in the same namespace.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              externalAccessIntegrations:
                description: ExternalAccessIntegrations lists external access integration
                  names.
                items:
                  type: string
                type: array
              handler:
                description: Handler is the fully qualified Scala handler method (e.g.
                  "com.example.MyClass.myMethod").
                maxLength: 255
                minLength: 1
                type: string
              imports:
                description: Imports lists stage file paths to import (e.g. "@my_stage/my_jar.jar").
                items:
                  type: string
                type: array
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                  observeOnly:
                    description: |-
                      ObserveOnly puts the resource into read-only mode. When true the
                      controller will Observe the Snowflake resource and populate status
                      but will never issue CREATE, ALTER, or DROP statements. Deletion
                      of the CR removes the finalizer without dropping the Snowflake
                      resource. Defaults to false.
                    type: boolean
                type: object
              name:
                description: Name is the Snowflake function name. Immutable after
                  creation.
                maxLength: 255
                minLength: 1
                type: string
              nullInputBehavior:
                description: NullInputBehavior specifies how the function handles
                  NULL arguments.
                enum:
                - CALLED ON NULL INPUT
                - RETURNS NULL ON NULL INPUT
                - STRICT
                type: string
              packages:
                description: Packages lists additional packages.
                items:
                  type: string
                type: array
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              returns:
                description: Returns is the return type (e.g. "VARCHAR", "TABLE(col1
                  VARCHAR, col2 NUMBER)").
                maxLength: 255
                minLength: 1
                type: string
              runtimeVersion:
                description: RuntimeVersion is the Scala runtime version (e.g. "2.12").
                maxLength: 255
                minLength: 1
                type: string
              schemaName:
                description: SchemaName is the Snowflake schema identifier (e.g. "PUBLIC").
                maxLength: 255
                minLength: 1
                type: string
              schemaRef:
                description: SchemaRef references a Schema CR in the same namespace.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              secrets:
                description: Secrets binds Snowflake secrets to variables accessible
                  from handler code.
                items:
                  description: |-
                    SecretBinding binds a Snowflake secret to a variable name for use in procedure/function handler code.
                    Secrets must be allowed by an external access integration specified in the same resource.
                  properties:
                    secretName:
                      description: |-
                        SecretName is the fully qualified name of the Snowflake secret
                        (e.g. "MY_DB"."MY_SCHEMA"."MY_SECRET").
                      maxLength: 255
                      minLength: 1
                      type: string
                    variableName:
                      description: VariableName is the variable name used to reference
                        the secret in handler code.
                      maxLength: 255
                      minLength: 1
                      type: string
                  required:
                  - secretName
                  - variableName
                  type: object
                type: array
              secure:
                description: Secure marks the function as secure.
                type: boolean
              snowparkPackage:
                description: SnowparkPackage is the Snowpark package spec (e.g. "com.snowflake:snowpark:latest").
                maxLength: 255
                minLength: 1
                type: string
              targetPath:
                description: TargetPath specifies the stage location for compiled
                  artifacts (e.g. "@my_stage/my_handler.jar").
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
              volatility:
                description: 'Volatility specifies the function volatility: VOLATILE
                  or IMMUTABLE.'
                enum:
                - VOLATILE
                - IMMUTABLE
                type: string
            required:
            - handler
            - name
            - providerRef
            - returns
            - runtimeVersion
            - snowparkPackage
            type: object
            x-kubernetes-validations:
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: exactly one of spec.schemaRef or spec.schemaName must be set
              rule: (has(self.schemaRef) && !has(self.schemaName)) || (!has(self.schemaRef)
                && has(self.schemaName))
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.schemaRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaRef) == has(self.schemaRef) && (!has(self.schemaRef)
                || self.schemaRef == oldSelf.schemaRef)
            - message: spec.schemaName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaName) == has(self.schemaName) && (!has(self.schemaName)
                || self.schemaName == oldSelf.schemaName)
            - message: spec.arguments is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.arguments) == has(self.arguments) && (!has(self.arguments)
                || self.arguments == oldSelf.arguments)
            - message: spec.returns is immutable (delete and recreate the resource
                to change)
              rule: self.returns == oldSelf.returns
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: spec.databaseName must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.databaseName) || !self.databaseName.contains(''.'')'
            - message: spec.schemaName must be a simple identifier, not a fully-qualified
                name; use spec.databaseName for the database part
              rule: '!has(self.schemaName) || !self.schemaName.contains(''.'')'
          status:
            description: FunctionScalaStatus defines the observed state of a FunctionScala.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseName:
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              schemaName:
                type: string
              showOutput:
                description: |-
                  FunctionShowOutput mirrors the SHOW USER FUNCTIONS output stored in status.
                  Shared by all function language variants.
                properties:
                  arguments:
                    description: Arguments is the function signature string (e.g.
                      "MY_FUNC(VARCHAR, NUMBER) RETURN VARCHAR").
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the function was
                      created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  description:
                    description: Description is the function comment/description.
                    type: string
                  isSecure:
                    description: IsSecure indicates whether the function is a secure
                      function.
                    type: boolean
                  language:
                    description: Language is the implementation language.
                    type: string
                  name:
                    description: Name is the function name as returned by Snowflake.
                    type: string
                  owner:
                    description: Owner is the role that owns the function.
                    type: string
                  schemaName:
                    description: SchemaName is the parent schema name.
                    type: string
                type: object
              trackedParameters:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
