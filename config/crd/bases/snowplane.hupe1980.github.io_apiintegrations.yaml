    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: APIIntegration is the Schema for the apiintegrations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: APIIntegrationSpec defines the desired state of a Snowflake
              API Integration.
            properties:
              apiAllowedPrefixes:
                description: APIAllowedPrefixes is the list of HTTPS endpoints allowed
                  by this integration.
                items:
                  type: string
                minItems: 1
                type: array
              apiAwsRoleArn:
                description: |-
                  APIAWSRoleARN is the IAM role ARN for AWS API Gateway integrations.
                  Required when apiProvider is aws_api_gateway, aws_private_api_gateway,
                  aws_gov_api_gateway, or aws_gov_private_api_gateway.
                type: string
              apiBlockedPrefixes:
                description: APIBlockedPrefixes is the list of HTTPS endpoints blocked
                  by this integration.
                items:
                  type: string
                type: array
              apiKey:
                description: APIKey is an optional API key for the integration.
                type: string
              apiProvider:
                description: APIProvider specifies the cloud provider for the API
                  integration. Immutable after creation.
                enum:
                - aws_api_gateway
                - aws_private_api_gateway
                - aws_gov_api_gateway
                - aws_gov_private_api_gateway
                - azure_api_management
                - google_api_gateway
                - git_https_api
                type: string
              azureAdApplicationId:
                description: |-
                  AzureADApplicationID is the Azure AD application (client) ID.
                  Required when apiProvider is azure_api_management.
                type: string
              azureTenantId:
                description: AzureTenantID is the Azure AD tenant ID. Required when
                  apiProvider is azure_api_management.
                type: string
              comment:
                description: Comment is an optional comment for the integration.
                maxLength: 10000
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              enabled:
                default: true
                description: Enabled controls whether the integration is active.
                type: boolean
              googleAudience:
                description: |-
                  GoogleAudience is the audience claim for Google API Gateway integrations.
                  Required when apiProvider is google_api_gateway.
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                  observeOnly:
                    description: |-
                      ObserveOnly puts the resource into read-only mode. When true the
                      controller will Observe the Snowflake resource and populate status
                      but will never issue CREATE, ALTER, or DROP statements. Deletion
                      of the CR removes the finalizer without dropping the Snowflake
                      resource. Defaults to false.
                    type: boolean
                type: object
              name:
                description: Name is the Snowflake API integration name. Immutable
                  after creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - apiAllowedPrefixes
            - apiProvider
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.apiProvider is immutable (delete and recreate the resource
                to change)
              rule: self.apiProvider == oldSelf.apiProvider
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
          status:
            description: APIIntegrationStatus defines the observed state of APIIntegration.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              describeOutput:
                additionalProperties:
                  type: string
                description: DescribeOutput contains the most recently observed DESCRIBE
                  INTEGRATION output.
                type: object
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              showOutput:
                description: ShowOutput contains the most recently observed SHOW API
                  INTEGRATIONS output.
                properties:
                  category:
                    description: Category is the integration category (API).
                    type: string
                  comment:
                    description: Comment is the integration comment.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the integration was
                      created.
                    type: string
                  enabled:
                    description: Enabled indicates whether the integration is active.
                    type: boolean
                  name:
                    description: Name is the Snowflake integration name.
                    type: string
                  type:
                    description: Type is the integration sub-type (e.g. EXTERNAL_API).
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters records which Snowflake parameters
                  were last applied by the controller.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
