title: Snowplane
description: Kubernetes-native control plane for Snowflake
url: "https://hupe1980.github.io"
baseurl: "/snowplane"

remote_theme: just-the-docs/just-the-docs@v0.10.1

color_scheme: dark

logo: "/assets/images/logo.svg"

permalink: pretty

aux_links:
  GitHub: https://github.com/hupe1980/snowplane

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

search_enabled: true
search.heading_level: 3
search.previews: 3
search.preview_words_before: 5
search.preview_words_after: 10
search.tokenizer_separator: /[\s/]+/

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Snowplane is licensed under the <a href="https://github.com/hupe1980/snowplane/blob/main/LICENSE">Apache License 2.0</a>.

ga_tracking:

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow

mermaid:
  version: "11"

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
