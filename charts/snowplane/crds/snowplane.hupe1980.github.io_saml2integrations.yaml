---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: saml2integrations.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: SAML2Integration
    listKind: SAML2IntegrationList
    plural: saml2integrations
    singular: saml2integration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: SYNCED
      type: string
    - jsonPath: .spec.name
      name: SNOWFLAKE-NAME
      type: string
    - jsonPath: .spec.providerRef.name
      name: PROVIDER
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SAML2Integration is the Schema for the saml2integrations API.
          It manages a Snowflake SAML2 security integration with dedicated, type-safe fields.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SAML2IntegrationSpec defines the desired state of a Snowflake
              SAML2 Security Integration.
            properties:
              allowedEmailPatterns:
                description: AllowedEmailPatterns is a list of email address patterns
                  allowed for SAML auto-provisioning.
                items:
                  type: string
                type: array
              allowedUserDomains:
                description: AllowedUserDomains is a list of email domains allowed
                  for SAML authentication.
                items:
                  type: string
                type: array
              comment:
                description: Comment is an optional description for the integration.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              enableSPInitiated:
                description: EnableSPInitiated controls whether Service Provider (SP)
                  initiated SAML login is enabled.
                type: boolean
              enabled:
                default: true
                description: Enabled controls whether the integration is active.
                type: boolean
              forceAuthn:
                description: ForceAuthn controls whether the IdP should force re-authentication
                  on every login.
                type: boolean
              issuer:
                description: Issuer is the SAML2 IdP entity ID / issuer URL.
                minLength: 1
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                type: object
              name:
                description: Name is the Snowflake security integration name. Immutable
                  after creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              postLogoutRedirectURL:
                description: PostLogoutRedirectURL is the URL to redirect the user
                  to after SAML logout.
                type: string
              provider:
                description: Provider is the SAML IdP provider name (e.g. CUSTOM,
                  OKTA, ADFS).
                minLength: 1
                type: string
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              requestedNameIDFormat:
                description: RequestedNameIDFormat specifies the NameID format to
                  request from the IdP.
                enum:
                - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
                - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
                - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
                - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
                type: string
              spInitiatedLoginPageLabel:
                description: SPInitiatedLoginPageLabel is the label for SP-initiated
                  login on the Snowflake login page.
                type: string
              ssoURL:
                description: SSOURL is the IdP Single Sign-On endpoint URL.
                minLength: 1
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
              x509Cert:
                description: X509Cert is the Base64-encoded X.509 certificate from
                  the IdP for SAML signature validation.
                minLength: 1
                type: string
            required:
            - issuer
            - name
            - provider
            - providerRef
            - ssoURL
            - x509Cert
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
          status:
            description: SAML2IntegrationStatus defines the observed state of a SAML2Integration.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              describeOutput:
                additionalProperties:
                  type: string
                description: DescribeOutput is a map of DESCRIBE INTEGRATION key-value
                  pairs.
                type: object
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              showOutput:
                description: ShowOutput contains the raw SHOW SECURITY INTEGRATIONS
                  output.
                properties:
                  category:
                    description: Category is the integration category (SECURITY).
                    type: string
                  comment:
                    description: Comment is the integration description.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the integration was
                      created.
                    type: string
                  enabled:
                    description: Enabled indicates whether the integration is active.
                    type: boolean
                  name:
                    description: Name is the integration name as returned by Snowflake.
                    type: string
                  type:
                    description: Type is the integration type (SAML2).
                    type: string
                type: object
              trackedParameters:
                description: TrackedParameters tracks which optional spec fields have
                  been actively SET.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
