              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecurityIntegrationSpec defines the desired state of a Snowflake
              Security Integration.
            properties:
              apiAuthentication:
                description: APIAuthentication holds configuration for API_AUTHENTICATION
                  integrations.
                properties:
                  oauthAllowedScopes:
                    description: OAuthAllowedScopes is the list of allowed OAuth scopes.
                    items:
                      type: string
                    type: array
                  oauthClientID:
                    description: OAuthClientID is the OAuth 2.0 client ID.
