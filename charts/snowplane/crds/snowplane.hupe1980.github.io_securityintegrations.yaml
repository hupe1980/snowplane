                    items:
                      type: string
                    type: array
                  enableSPInitiated:
                    description: EnableSPInitiated controls whether SP-initiated login
                      is enabled.
                    type: boolean
                  forceAuthn:
                    description: ForceAuthn controls whether force authentication
                      is requested.
                    type: boolean
                  issuer:
                    description: Issuer is the SAML2 IdP entity ID / issuer.
                    minLength: 1
                    type: string
                  postLogoutRedirectURL:
                    description: PostLogoutRedirectURL is the URL to redirect to after
                      SAML logout.
                    type: string
                  provider:
                    description: Provider is the SAML IdP provider name (e.g. CUSTOM,
                      OKTA, ADFS).
                    minLength: 1
                    type: string
                  requestedNameIDFormat:
                    description: RequestedNameIDFormat specifies the NameID format
                      to request from the IdP.
                    enum:
                    - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
                    - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
                    - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
                    - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
                    type: string
                  spInitiatedLoginPageLabel:
                    description: SPInitiatedLoginPageLabel is the label for the SP-initiated
                      login page.
                    type: string
                  ssoURL:
                    description: SSOURL is the IdP SSO URL.
                    minLength: 1
                    type: string
                  x509Cert:
                    description: X509Cert is the Base64-encoded X.509 certificate
                      from the IdP for signature validation.
                    minLength: 1
                    type: string
                required:
                - issuer
                - provider
                - ssoURL
                - x509Cert
                type: object
              scim:
                description: SCIM holds configuration for SCIM integrations.
                properties:
                  networkPolicy:
                    description: NetworkPolicy is the optional network policy attached
                      to the SCIM integration.
                    type: string
                  runAsRole:
                    description: RunAsRole is the Snowflake role used to create users/groups
                      via SCIM.
                    minLength: 1
                    type: string
                  scimClient:
                    description: SCIMClient is the identity provider type (OKTA, AZURE,
                      GENERIC).
                    enum:
                    - OKTA
                    - AZURE
                    - GENERIC
                    type: string
                  syncPassword:
                    description: SyncPassword controls whether user passwords are
                      synced from the IdP.
                    type: boolean
                required:
                - runAsRole
                - scimClient
                type: object
              type:
                description: |-
                  Type specifies the integration type (API_AUTHENTICATION, EXTERNAL_OAUTH, SAML2, SCIM).
                  Immutable after creation.
                enum:
                - API_AUTHENTICATION
                - EXTERNAL_OAUTH
                - SAML2
                - SCIM
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
