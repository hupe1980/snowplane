    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TableConstraint is the Schema for the tableconstraints API.
          It manages a Snowflake table constraint (PRIMARY KEY, UNIQUE, or FOREIGN KEY).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "TableConstraintSpec defines the desired state of a TableConstraint.\nManages
              a Snowflake table constraint via:\n\n\tALTER TABLE <table_name> ADD
              CONSTRAINT <name> <type> (<columns>)\n\tALTER TABLE <table_name> DROP
              CONSTRAINT <name>\n\nAll identity fields (name, type, tableName, columns)
              are immutable\nafter creation — changing any of them requires deleting
              and\nrecreating the resource."
            properties:
              columns:
                description: |-
                  Columns is the list of column names that make up the constraint key.
                  Immutable after creation.
                items:
                  type: string
                minItems: 1
                type: array
              comment:
                description: Comment for the constraint.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              foreignKeyProperties:
                description: |-
                  ForeignKeyProperties is required when type is FOREIGN KEY, and
                  must not be set for other constraint types.
                  Immutable after creation.
                properties:
                  match:
                    description: Match is the match type for the foreign key.
                    enum:
                    - FULL
                    - PARTIAL
                    - SIMPLE
                    type: string
                  onDelete:
                    description: |-
                      OnDelete specifies the action performed when the primary/unique key
                      for the foreign key is deleted.
                    enum:
                    - CASCADE
                    - SET NULL
                    - SET DEFAULT
                    - RESTRICT
                    - NO ACTION
                    type: string
                  onUpdate:
                    description: |-
                      OnUpdate specifies the action performed when the primary/unique key
                      for the foreign key is updated.
                    enum:
                    - CASCADE
                    - SET NULL
                    - SET DEFAULT
                    - RESTRICT
                    - NO ACTION
                    type: string
                  referencesColumns:
                    description: ReferencesColumns is the list of columns in the referenced
                      table.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  referencesTableName:
                    description: |-
                      ReferencesTableName is the fully qualified Snowflake table name that
                      the foreign key references (e.g. "MY_DB"."MY_SCHEMA"."MY_TABLE").
                    maxLength: 255
                    minLength: 1
                    type: string
                required:
                - referencesColumns
                - referencesTableName
                type: object
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                type: object
              name:
                description: |-
                  Name is the constraint name in Snowflake.
                  Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              properties:
                description: |-
                  Properties defines optional constraint properties (enforced, deferrable, etc.).
                  Mutable — can be altered after creation.
                properties:
                  deferrable:
                    description: Deferrable specifies whether the constraint is deferrable.
                    type: boolean
                  enforced:
                    description: Enforced specifies whether the constraint is enforced.
                    type: boolean
                  initially:
                    description: |-
                      Initially specifies whether a deferrable constraint is
                      initially deferred or immediate.
                    enum:
                    - DEFERRED
                    - IMMEDIATE
                    type: string
                  rely:
                    description: |-
                      Rely specifies whether a constraint in NOVALIDATE mode is taken
                      into account during query rewrite.
                    type: boolean
                  validate:
                    description: |-
                      Validate specifies whether to validate existing data on the table
                      when a constraint is created.
                    type: boolean
                type: object
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              tableName:
                description: |-
                  TableName is the fully qualified Snowflake table name
                  (e.g. "MY_DB"."MY_SCHEMA"."MY_TABLE").
                  Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              type:
                description: |-
                  Type is the constraint type.
                  Immutable after creation.
                enum:
                - PRIMARY KEY
                - UNIQUE
                - FOREIGN KEY
                type: string
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - columns
            - name
            - providerRef
            - tableName
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.tableName is immutable (delete and recreate the resource
                to change)
              rule: self.tableName == oldSelf.tableName
            - message: spec.type is immutable (delete and recreate the resource to
                change)
              rule: self.type == oldSelf.type
            - message: spec.columns is immutable (delete and recreate the resource
                to change)
              rule: self.columns == oldSelf.columns
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: spec.foreignKeyProperties is immutable (delete and recreate
                the resource to change)
              rule: has(oldSelf.foreignKeyProperties) == has(self.foreignKeyProperties)
                && (!has(self.foreignKeyProperties) || self.foreignKeyProperties ==
                oldSelf.foreignKeyProperties)
            - message: spec.foreignKeyProperties can only be set when spec.type is
                'FOREIGN KEY'
              rule: self.type == 'FOREIGN KEY' || !has(self.foreignKeyProperties)
            - message: spec.foreignKeyProperties is required when spec.type is 'FOREIGN
                KEY'
              rule: self.type != 'FOREIGN KEY' || has(self.foreignKeyProperties)
          status:
            description: TableConstraintStatus defines the observed state of a TableConstraint.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              constraintName:
                description: ConstraintName is the constraint name as observed in
                  Snowflake.
                type: string
              constraintType:
                description: ConstraintType is the constraint type as observed in
                  Snowflake.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
            type: object
        type: object
