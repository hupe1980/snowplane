kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: tasks.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: Task
    listKind: TaskList
    plural: tasks
    shortNames:
    - tsk
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
