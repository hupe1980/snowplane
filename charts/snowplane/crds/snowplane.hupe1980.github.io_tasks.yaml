    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Task is the Schema for the tasks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TaskSpec defines the desired state of a Snowflake Task.
            properties:
              after:
                description: |-
                  After specifies predecessor tasks for DAG scheduling.
                  Each entry references either a Task CR or a raw Snowflake task name.
                items:
                  description: |-
                    TaskPredecessor specifies a predecessor task for DAG scheduling.
                    Exactly one of Ref or Name must be set.
                  properties:
                    name:
                      description: Name is the Snowflake task identifier.
                      maxLength: 255
                      minLength: 1
                      type: string
                    ref:
                      description: Ref references a Task CR in the same namespace.
                      properties:
                        name:
                          description: Name of the referent.
                          maxLength: 255
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace of the referent. Defaults to the namespace of the
                            referencing resource when omitted, enabling cross-namespace
                            references in platform/project-team enterprise topologies.
                          type: string
                      required:
                      - name
                      type: object
                  type: object
                maxItems: 100
                type: array
              allowOverlappingExecution:
                description: AllowOverlappingExecution allows multiple instances of
                  the task graph to run concurrently.
                type: boolean
              comment:
                description: Comment is an optional description for the task.
                maxLength: 10000
                type: string
              config:
                description: |-
                  Config specifies the default configuration string in valid JSON format
                  that all tasks in a task graph can access via SYSTEM$GET_TASK_GRAPH_CONFIG.
                type: string
              databaseName:
                description: |-
                  DatabaseName is the Snowflake database identifier (e.g. "ANALYTICS").
                  Mutually exclusive with DatabaseRef. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef references a Database CR in the same namespace.
                  Mutually exclusive with DatabaseName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              errorIntegrationName:
                description: |-
                  ErrorIntegrationName is the Snowflake notification integration identifier for error notifications.
                  Mutually exclusive with ErrorIntegrationRef.
                maxLength: 255
                minLength: 1
                type: string
              errorIntegrationRef:
                description: |-
                  ErrorIntegrationRef references a NotificationIntegration CR for error notifications.
                  Mutually exclusive with ErrorIntegrationName.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              finalizeName:
                description: |-
                  FinalizeName is the name of a root task that this finalizer task is
                  associated with. Finalizer tasks run after all other tasks in the task
                  graph complete. Mutually exclusive with FinalizeRef, Schedule, and After.
                type: string
              finalizeRef:
                description: |-
                  FinalizeRef references a Task CR that this finalizer task is associated with.
                  Finalizer tasks run after all other tasks in the task graph complete.
                  Mutually exclusive with FinalizeName, Schedule, and After.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              logLevel:
                description: LogLevel specifies the severity level of events for the
                  task.
                enum:
                - TRACE
                - DEBUG
                - INFO
                - WARN
                - ERROR
                - FATAL
                - "OFF"
                type: string
              managementPolicies:
                description: ManagementPolicies specifies lifecycle policies for this
                  resource.
                properties:
                  adoptionPolicy:
                    default: fail-if-exists
                    description: |-
                      AdoptionPolicy controls how the reconciler handles a pre-existing
                      Snowflake resource on first reconciliation.
                      Defaults to "fail-if-exists".
                    enum:
                    - adopt
                    - fail-if-exists
                    type: string
                  createOrAlter:
                    default: true
                    description: |-
                      CreateOrAlter controls whether CREATE OR ALTER is used instead of
                      the legacy CREATE + ALTER two-step flow for supported resource types.
                      Defaults to true.
                    type: boolean
                  driftPolicy:
                    default: correct
                    description: |-
                      DriftPolicy controls whether detected drift is corrected or only
                      reported via conditions and events.
                      Defaults to "correct".
                    enum:
                    - correct
                    - detect-only
                    type: string
                  observeOnly:
                    description: |-
                      ObserveOnly puts the resource into read-only mode. When true the
                      controller will Observe the Snowflake resource and populate status
                      but will never issue CREATE, ALTER, or DROP statements. Deletion
                      of the CR removes the finalizer without dropping the Snowflake
                      resource. Defaults to false.
                    type: boolean
                type: object
              name:
                description: Name is the Snowflake task name. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              paused:
                description: |-
                  Paused suspends reconciliation of this resource. When true, the
                  controller skips all Snowflake operations and sets Synced=False
                  with reason ReconcilePaused. The Snowflake resource is not modified
                  or deleted while paused.
                type: boolean
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              schedule:
                description: |-
                  Schedule defines when the task runs. Required for standalone and root tasks.
                  Examples: "5 MINUTES", "USING CRON 0 9-17 * * SUN America/Los_Angeles"
                type: string
              schemaName:
                description: |-
                  SchemaName is the Snowflake schema identifier (e.g. "PUBLIC").
                  Mutually exclusive with SchemaRef. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
              schemaRef:
                description: |-
                  SchemaRef references a Schema CR in the same namespace.
                  Mutually exclusive with SchemaName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              serverlessTaskMaxStatementSize:
                description: |-
                  ServerlessTaskMaxStatementSize specifies the maximum warehouse size for
                  the serverless task. Only applies to serverless tasks.
                enum:
                - XSMALL
                - SMALL
                - MEDIUM
                - LARGE
                - XLARGE
                - XXLARGE
                type: string
              serverlessTaskMinStatementSize:
                description: |-
                  ServerlessTaskMinStatementSize specifies the minimum warehouse size for
                  the serverless task. Only applies to serverless tasks.
                enum:
                - XSMALL
                - SMALL
                - MEDIUM
                - LARGE
                - XLARGE
                - XXLARGE
                type: string
              sqlStatement:
                description: SQLStatement is the SQL code executed when the task runs.
                maxLength: 65536
                minLength: 1
                type: string
              successIntegrationName:
                description: |-
                  SuccessIntegrationName is the Snowflake notification integration identifier for success notifications.
                  Mutually exclusive with SuccessIntegrationRef.
                maxLength: 255
                minLength: 1
                type: string
              successIntegrationRef:
                description: |-
                  SuccessIntegrationRef references a NotificationIntegration CR for success notifications.
                  Mutually exclusive with SuccessIntegrationName.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              suspend:
                default: true
                description: |-
                  Suspend indicates whether the task should be suspended. Default is true
                  (tasks are created in suspended state).
                type: boolean
              suspendTaskAfterNumFailures:
                description: |-
                  SuspendTaskAfterNumFailures specifies the number of consecutive failed runs
                  before the task is automatically suspended.
                format: int32
                minimum: 0
                type: integer
              targetCompletionInterval:
                description: |-
                  TargetCompletionInterval specifies the desired task completion time.
                  Only applies to serverless tasks. Required for serverless triggered tasks.
                  Examples: "10 MINUTES", "1 HOURS"
                type: string
              taskAutoRetryAttempts:
                description: TaskAutoRetryAttempts specifies the number of automatic
                  retry attempts (0-30).
                format: int32
                maximum: 30
                minimum: 0
                type: integer
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                maxLength: 255
                minLength: 1
                type: string
              userTaskManagedInitialWarehouseSize:
                description: |-
                  UserTaskManagedInitialWarehouseSize sets the initial size for serverless tasks.
                  Mutually exclusive with WarehouseRef and WarehouseName.
                enum:
                - XSMALL
                - SMALL
                - MEDIUM
                - LARGE
                - XLARGE
                - XXLARGE
                type: string
              userTaskMinimumTriggerIntervalInSeconds:
                description: |-
                  UserTaskMinimumTriggerIntervalInSeconds defines how frequently a triggered task
                  can execute, in seconds. Changes within this interval are batched together.
                format: int32
                maximum: 604800
                minimum: 10
                type: integer
              userTaskTimeoutMs:
                description: UserTaskTimeoutMs specifies the time limit on a single
                  run in milliseconds (0-604800000).
                format: int32
                maximum: 604800000
                minimum: 0
                type: integer
              warehouseName:
                description: |-
                  WarehouseName is the Snowflake warehouse identifier (e.g. "COMPUTE_WH").
                  Mutually exclusive with WarehouseRef and UserTaskManagedInitialWarehouseSize.
                maxLength: 255
                minLength: 1
                type: string
              warehouseRef:
                description: |-
                  WarehouseRef references a Warehouse CR in the same namespace.
                  Mutually exclusive with WarehouseName and UserTaskManagedInitialWarehouseSize.
                properties:
                  name:
                    description: Name of the referent.
                    maxLength: 255
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent. Defaults to the namespace of the
                      referencing resource when omitted, enabling cross-namespace
                      references in platform/project-team enterprise topologies.
                    type: string
                required:
                - name
                type: object
              when:
                description: When specifies a boolean SQL expression that determines
                  whether the task runs.
                type: string
            required:
            - name
            - providerRef
            - sqlStatement
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.schemaRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaRef) == has(self.schemaRef) && (!has(self.schemaRef)
                || self.schemaRef == oldSelf.schemaRef)
            - message: spec.schemaName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaName) == has(self.schemaName) && (!has(self.schemaName)
                || self.schemaName == oldSelf.schemaName)
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: exactly one of spec.schemaRef or spec.schemaName must be set
              rule: (has(self.schemaRef) && !has(self.schemaName)) || (!has(self.schemaRef)
                && has(self.schemaName))
            - message: spec.warehouseRef/warehouseName and spec.userTaskManagedInitialWarehouseSize
                are mutually exclusive
              rule: '!(has(self.warehouseRef) && has(self.userTaskManagedInitialWarehouseSize))
                && !(has(self.warehouseName) && has(self.userTaskManagedInitialWarehouseSize))'
            - message: spec.warehouseRef and spec.warehouseName are mutually exclusive
              rule: '!(has(self.warehouseRef) && has(self.warehouseName))'
            - message: spec.warehouseName must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.warehouseName) || !self.warehouseName.contains(''.'')'
            - message: spec.errorIntegrationRef and spec.errorIntegrationName are
                mutually exclusive
              rule: '!(has(self.errorIntegrationRef) && has(self.errorIntegrationName))'
            - message: spec.successIntegrationRef and spec.successIntegrationName
                are mutually exclusive
              rule: '!(has(self.successIntegrationRef) && has(self.successIntegrationName))'
            - message: spec.finalizeRef and spec.finalizeName are mutually exclusive
              rule: '!(has(self.finalizeRef) && has(self.finalizeName))'
            - message: spec.finalizeName and spec.schedule are mutually exclusive
              rule: '!has(self.finalizeName) || !has(self.schedule)'
            - message: spec.finalizeRef and spec.schedule are mutually exclusive
              rule: '!has(self.finalizeRef) || !has(self.schedule)'
            - message: spec.finalizeName and spec.after are mutually exclusive
              rule: '!has(self.finalizeName) || !has(self.after) || size(self.after)
                == 0'
            - message: spec.finalizeRef and spec.after are mutually exclusive
              rule: '!has(self.finalizeRef) || !has(self.after) || size(self.after)
                == 0'
            - message: each entry in spec.after must set exactly one of ref or name
              rule: '!has(self.after) || self.after.all(p, (has(p.ref) && !has(p.name))
                || (!has(p.ref) && has(p.name)))'
            - message: spec.after[].name must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.after) || self.after.all(p, !has(p.name) || !p.name.contains(''.''))'
            - message: spec.databaseName must be a simple identifier, not a fully-qualified
                name
              rule: '!has(self.databaseName) || !self.databaseName.contains(''.'')'
            - message: spec.schemaName must be a simple identifier, not a fully-qualified
                name; use spec.databaseName for the database part
              rule: '!has(self.schemaName) || !self.schemaName.contains(''.'')'
          status:
            description: TaskStatus defines the observed state of a Task.
            properties:
              afterNames:
                description: AfterNames is the resolved list of predecessor task names.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databaseName:
                description: DatabaseName is the parent Snowflake database name.
                type: string
              errorIntegrationName:
                description: ErrorIntegrationName is the resolved error integration
                  name.
                type: string
              finalizeName:
                description: FinalizeName is the resolved finalize task name.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              lastReconcileTime:
                description: |-
                  LastReconcileTime is the timestamp of the most recent successful
                  reconciliation. Useful for SLO monitoring and diagnosing whether
                  reconciliation is running for a specific resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              parameters:
                description: Parameters contains the session-level task parameters
                  from SHOW PARAMETERS IN TASK.
                properties:
                  logLevel:
                    description: LogLevel is the severity level of events for the
                      task.
                    type: string
                  suspendTaskAfterNumFailures:
                    description: SuspendTaskAfterNumFailures is the number of consecutive
                      failures before suspension.
                    format: int32
                    type: integer
                  targetCompletionInterval:
                    description: TargetCompletionInterval is the target completion
                      interval for the task.
                    type: string
                  taskAutoRetryAttempts:
                    description: TaskAutoRetryAttempts is the number of automatic
                      retry attempts.
                    format: int32
                    type: integer
                  userTaskManagedInitialWarehouseSize:
                    description: UserTaskManagedInitialWarehouseSize is the initial
                      warehouse size for serverless tasks.
                    type: string
                  userTaskMinimumTriggerIntervalInSeconds:
                    description: UserTaskMinimumTriggerIntervalInSeconds defines how
                      frequently a triggered task can execute.
                    format: int32
                    type: integer
                  userTaskTimeoutMs:
                    description: UserTaskTimeoutMs is the task timeout in milliseconds.
                    format: int32
                    type: integer
                type: object
              schemaName:
                description: SchemaName is the parent Snowflake schema name.
                type: string
              showOutput:
                description: ShowOutput contains the raw SHOW TASKS output for this
                  task.
                properties:
                  allowOverlappingExecution:
                    description: AllowOverlappingExecution indicates whether concurrent
                      graph runs are allowed.
                    type: boolean
                  comment:
                    description: Comment is the task description.
                    type: string
                  condition:
                    description: Condition is the WHEN clause.
                    type: string
                  config:
                    description: Config is the task configuration JSON string.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the task was created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  definition:
                    description: Definition is the SQL statement body.
                    type: string
                  errorIntegration:
                    description: ErrorIntegration is the error notification integration.
                    type: string
                  name:
                    description: Name is the task name as returned by Snowflake.
                    type: string
                  owner:
                    description: Owner is the role that owns the task.
                    type: string
                  predecessors:
                    description: Predecessors is a comma-separated list of predecessor
                      task names.
                    type: string
                  schedule:
                    description: Schedule is the task schedule expression.
                    type: string
                  schemaName:
                    description: SchemaName is the parent schema name.
                    type: string
                  state:
                    description: State is the task state (started or suspended).
                    type: string
                  warehouse:
                    description: Warehouse is the warehouse used by the task.
                    type: string
                type: object
              successIntegrationName:
                description: SuccessIntegrationName is the resolved success integration
                  name.
                type: string
              trackedParameters:
                description: |-
                  TrackedParameters tracks which optional spec fields have been actively SET
                  in Snowflake.
                items:
                  type: string
                type: array
              warehouseName:
                description: WarehouseName is the resolved warehouse name.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
