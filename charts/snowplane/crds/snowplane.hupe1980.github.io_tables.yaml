---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: tables.snowplane.hupe1980.github.io
spec:
  group: snowplane.hupe1980.github.io
  names:
    categories:
    - snowplane
    kind: Table
    listKind: TableList
    plural: tables
    singular: table
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: SYNCED
      type: string
    - jsonPath: .spec.name
      name: SNOWFLAKE-NAME
      type: string
    - jsonPath: .status.databaseName
      name: DATABASE
      type: string
    - jsonPath: .status.schemaName
      name: SCHEMA
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Table is the Schema for the tables API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TableSpec defines the desired state of a Table.
            properties:
              changeTracking:
                description: ChangeTracking enables change tracking on the table.
                type: boolean
              clusterBy:
                description: ClusterBy specifies the clustering key expressions for
                  the table.
                items:
                  type: string
                type: array
              columns:
                description: Columns defines the table's column structure.
                items:
                  description: ColumnDefinition describes a single column in a Snowflake
                    table.
                  properties:
                    comment:
                      description: Comment is an optional description for the column.
                      type: string
                    default:
                      description: Default is the column's default value expression.
                      type: string
                    name:
                      description: Name is the column name.
                      minLength: 1
                      type: string
                    nullable:
                      description: Nullable indicates whether the column allows NULL
                        values. Defaults to true.
                      type: boolean
                    type:
                      description: Type is the Snowflake data type (e.g. VARCHAR,
                        NUMBER(38,0), TIMESTAMP_NTZ).
                      minLength: 1
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
              comment:
                description: Comment is an optional description for the table.
                type: string
              constraints:
                description: |-
                  Constraints defines table-level constraints (PRIMARY KEY, UNIQUE, FOREIGN KEY).
                  Constraints are applied at creation time and treated as immutable.
                items:
                  description: TableConstraint defines a table-level constraint (PRIMARY
                    KEY, UNIQUE, FOREIGN KEY).
                  properties:
                    columns:
                      description: Columns lists the column names that participate
                        in the constraint.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    foreignKey:
                      description: |-
                        ForeignKey specifies the referenced table and columns for FOREIGN KEY constraints.
                        Required when type is ForeignKey.
                      properties:
                        columns:
                          description: Columns lists the column names in the referenced
                            table.
                          items:
                            type: string
                          minItems: 1
                          type: array
                        table:
                          description: Table is the fully qualified name of the referenced
                            table (e.g. "ANALYTICS"."PUBLIC"."ORDERS").
                          minLength: 1
                          type: string
                      required:
                      - columns
                      - table
                      type: object
                    name:
                      description: Name is the constraint name. If omitted, Snowflake
                        generates one.
                      type: string
                    type:
                      description: Type is the constraint type.
                      enum:
                      - PrimaryKey
                      - Unique
                      - ForeignKey
                      type: string
                  required:
                  - columns
                  - type
                  type: object
                type: array
              dataRetentionTimeInDays:
                description: DataRetentionTimeInDays specifies the Time Travel retention
                  period (0–90 days).
                format: int32
                maximum: 90
                minimum: 0
                type: integer
              databaseName:
                description: |-
                  DatabaseName is the raw Snowflake database identifier (e.g. "ANALYTICS").
                  Use this when the database is NOT managed by Snowplane.
                  Mutually exclusive with DatabaseRef. Immutable after creation.
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef references a Database CR in the same namespace.
                  Mutually exclusive with DatabaseName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              defaultDdlCollation:
                description: DefaultDDLCollation sets the default collation for string
                  columns.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what happens to the Snowflake resource when the CR is deleted.
                  Defaults to "Delete".
                enum:
                - Delete
                - Orphan
                type: string
              enableSchemaEvolution:
                description: EnableSchemaEvolution enables automatic schema evolution.
                type: boolean
              maxDataExtensionTimeInDays:
                description: |-
                  MaxDataExtensionTimeInDays specifies the maximum number of days Snowflake
                  can extend the data retention period.
                format: int32
                maximum: 90
                minimum: 0
                type: integer
              name:
                description: Name is the Snowflake table name. Immutable after creation.
                minLength: 1
                type: string
              providerRef:
                description: ProviderRef references the ProviderConfig to use for
                  Snowflake connectivity.
                properties:
                  name:
                    default: default
                    description: Name of the ProviderConfig to use.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ProviderConfig. Defaults to the namespace of the
                      referring resource. Set this to reference a ProviderConfig in a
                      different namespace (e.g. a shared system namespace).
                    type: string
                type: object
              schemaName:
                description: |-
                  SchemaName is the raw Snowflake schema FQN (e.g. '"ANALYTICS"."PUBLIC"').
                  Use this when the schema is NOT managed by Snowplane.
                  Mutually exclusive with SchemaRef. Immutable after creation.
                minLength: 1
                type: string
              schemaRef:
                description: |-
                  SchemaRef references a Schema CR in the same namespace.
                  Mutually exclusive with SchemaName. Immutable after creation.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              transient:
                default: false
                description: Transient indicates this is a transient table (no Fail-safe).
                  Immutable after creation.
                type: boolean
              useRole:
                description: |-
                  UseRole specifies the Snowflake role to activate via USE ROLE before
                  CREATE/ALTER/DROP operations. In Snowflake's DAC model the role active
                  at CREATE time becomes the object owner, so this field indirectly
                  controls initial ownership.
                  This field is immutable after the resource has been created in Snowflake.
                minLength: 1
                type: string
            required:
            - columns
            - name
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable (delete and recreate the resource to
                change)
              rule: self.name == oldSelf.name
            - message: spec.databaseRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseRef) == has(self.databaseRef) && (!has(self.databaseRef)
                || self.databaseRef == oldSelf.databaseRef)
            - message: spec.databaseName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
            - message: spec.schemaRef is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaRef) == has(self.schemaRef) && (!has(self.schemaRef)
                || self.schemaRef == oldSelf.schemaRef)
            - message: spec.schemaName is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.schemaName) == has(self.schemaName) && (!has(self.schemaName)
                || self.schemaName == oldSelf.schemaName)
            - message: spec.transient is immutable (delete and recreate the resource
                to change)
              rule: self.transient == oldSelf.transient
            - message: spec.useRole is immutable (delete and recreate the resource
                to change)
              rule: has(oldSelf.useRole) == has(self.useRole) && (!has(self.useRole)
                || self.useRole == oldSelf.useRole)
            - message: exactly one of spec.databaseRef or spec.databaseName must be
                set
              rule: (has(self.databaseRef) && !has(self.databaseName)) || (!has(self.databaseRef)
                && has(self.databaseName))
            - message: exactly one of spec.schemaRef or spec.schemaName must be set
              rule: (has(self.schemaRef) && !has(self.schemaName)) || (!has(self.schemaRef)
                && has(self.schemaName))
            - message: spec.constraints is immutable (delete and recreate the resource
                to change)
              rule: '!has(oldSelf.constraints) || !has(self.constraints) || self.constraints
                == oldSelf.constraints'
          status:
            description: TableStatus defines the observed state of a Table.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              databaseName:
                description: DatabaseName is the parent Snowflake database name.
                type: string
              fullyQualifiedName:
                description: FullyQualifiedName is the Snowflake fully qualified identifier
                  for this resource.
                type: string
              lastAppliedSpecHash:
                description: |-
                  LastAppliedSpecHash is the SHA-256 hash of the spec as of the last
                  successful reconciliation. The reconciler uses this to distinguish
                  spec changes (user edited the CR) from external drift (Snowflake
                  state diverged without a spec change). This is more reliable than
                  comparing ObservedGeneration vs Generation because metadata-only
                  changes (labels, annotations) increment Generation without changing
                  the spec.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              schemaName:
                description: SchemaName is the parent Snowflake schema name.
                type: string
              showOutput:
                description: ShowOutput contains the raw SHOW TABLES output for this
                  table.
                properties:
                  changeTracking:
                    description: ChangeTracking indicates whether change tracking
                      is enabled.
                    type: boolean
                  clusterBy:
                    description: ClusterBy is the clustering key expression.
                    type: string
                  comment:
                    description: Comment is the table description.
                    type: string
                  createdOn:
                    description: CreatedOn is the timestamp when the table was created.
                    type: string
                  databaseName:
                    description: DatabaseName is the parent database name.
                    type: string
                  enableSchemaEvolution:
                    description: EnableSchemaEvolution indicates whether schema evolution
                      is enabled.
                    type: boolean
                  kind:
                    description: Kind is the table kind (TABLE, TRANSIENT, or TEMPORARY).
                    type: string
                  name:
                    description: Name is the table name as returned by Snowflake.
                    type: string
                  owner:
                    description: Owner is the role that owns the table.
                    type: string
                  retentionTime:
                    description: RetentionTime is the data retention time in days.
                    format: int32
                    type: integer
                  schemaName:
                    description: SchemaName is the parent schema name.
                    type: string
                type: object
              trackedParameters:
                description: |-
                  TrackedParameters tracks which optional spec fields have been actively SET
                  in Snowflake. When a previously-managed field is removed from the spec,
                  the reconciler issues ALTER ... UNSET to revert to the server default.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
