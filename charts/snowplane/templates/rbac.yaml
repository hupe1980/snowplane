apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "snowplane.fullname" . }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.secrets.read }}
# Secrets — read-only for ProviderConfig credential resolution and User secret refs.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- if .Values.rbac.secrets.write }}
# Secrets — write access for FieldExport target management.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - patch
  - delete
{{- end }}
# ConfigMaps — read access for controller-runtime caches.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
{{- if .Values.rbac.configMaps.write }}
  - create
  - patch
  - delete
{{- end }}
# Events — emit Kubernetes events on reconciliation.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Snowplane CRDs — full lifecycle.
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases
  - schemas
  - warehouses
  - accountroles
  - databaseroles
  - accountrolegrants
  - databaserolegrants
  - sharegrants
  - users
  - tables
  - views
  - stages
  - tasks
  - streams
  - tags
  - networkpolicies
  - resourcemonitors
  - maskingpolicies
  - rowaccesspolicies
  - grantownerships
  - fieldexports
  - providerconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/status
  - schemas/status
  - warehouses/status
  - accountroles/status
  - databaseroles/status
  - accountrolegrants/status
  - databaserolegrants/status
  - sharegrants/status
  - users/status
  - tables/status
  - views/status
  - stages/status
  - tasks/status
  - streams/status
  - tags/status
  - networkpolicies/status
  - resourcemonitors/status
  - maskingpolicies/status
  - rowaccesspolicies/status
  - grantownerships/status
  - fieldexports/status
  - providerconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/finalizers
  - schemas/finalizers
  - warehouses/finalizers
  - accountroles/finalizers
  - databaseroles/finalizers
  - accountrolegrants/finalizers
  - databaserolegrants/finalizers
  - sharegrants/finalizers
  - users/finalizers
  - tables/finalizers
  - views/finalizers
  - stages/finalizers
  - tasks/finalizers
  - streams/finalizers
  - tags/finalizers
  - networkpolicies/finalizers
  - resourcemonitors/finalizers
  - maskingpolicies/finalizers
  - rowaccesspolicies/finalizers
  - grantownerships/finalizers
  - fieldexports/finalizers
  - providerconfigs/finalizers
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "snowplane.fullname" . }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "snowplane.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "snowplane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election — namespace-scoped (leases only needed in controller namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "snowplane.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "snowplane.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "snowplane.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "snowplane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Viewer ClusterRole — read-only access to all Snowplane CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
