---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "snowplane.fullname" . }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "snowplane.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "snowplane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election — namespace-scoped (leases only needed in controller namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "snowplane.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "snowplane.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "snowplane.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "snowplane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
