apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "snowplane.fullname" . }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.secrets.read }}
# Secrets — read-only for ProviderConfig credential resolution and User secret refs.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- if .Values.rbac.secrets.write }}
# Secrets — write access for FieldExport target management.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - update
  - patch
  - delete
{{- end }}
# ConfigMaps — read access for controller-runtime caches.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
{{- if .Values.rbac.configMaps.write }}
  - create
  - update
  - patch
  - delete
{{- end }}
# Events — emit Kubernetes events on reconciliation.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Snowplane CRDs — full lifecycle.
- apiGroups:
  - snowplane.hupe1980.github.io
