    {{- include "snowplane.labels" . | nindent 4 }}
    rbac.snowplane.hupe1980.github.io/aggregate-to-viewer: "true"
rules:
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases
  - schemas
  - warehouses
  - accountroles
  - databaseroles
  - accountrolegrants
  - databaserolegrants
  - sharegrants
  - users
  - tables
  - views
  - stages
  - tasks
  - streams
  - tags
  - networkpolicies
  - resourcemonitors
  - maskingpolicies
  - rowaccesspolicies
  - grantownerships
  - fieldexports
  - providerconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snowplane.hupe1980.github.io
  resources:
  - databases/status
  - schemas/status
  - warehouses/status
  - accountroles/status
  - databaseroles/status
  - accountrolegrants/status
  - databaserolegrants/status
  - sharegrants/status
  - users/status
  - tables/status
  - views/status
  - stages/status
  - tasks/status
  - streams/status
  - tags/status
  - networkpolicies/status
  - resourcemonitors/status
  - maskingpolicies/status
  - rowaccesspolicies/status
  - grantownerships/status
  - fieldexports/status
  - providerconfigs/status
  verbs:
  - get
