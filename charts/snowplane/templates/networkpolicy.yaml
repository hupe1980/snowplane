{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "snowplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "snowplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics scraping and health/readiness probes.
    - ports:
        - port: {{ .Values.metrics.containerPort | default 8080 }}
          protocol: TCP
        - port: {{ .Values.healthProbes.containerPort | default 8081 }}
          protocol: TCP
      {{- if .Values.networkPolicy.metricsNamespace }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace }}
      {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution (kube-dns / CoreDNS).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- if .Values.networkPolicy.restrictDNS }}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      {{- end }}
    # Allow HTTPS (Snowflake API) and Kubernetes API server.
    # When egressCIDRs is set, traffic is restricted to those destinations only.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      {{- with .Values.networkPolicy.egressCIDRs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
