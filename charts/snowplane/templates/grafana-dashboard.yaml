{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snowplane.fullname" . }}-grafana-dashboard
  namespace: {{ .Values.grafana.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  snowplane-dashboard.json: |-
{{ .Files.Get "dashboards/snowplane-dashboard.json" | indent 4 }}
{{- end }}
