apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snowplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "snowplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "snowplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snowplane.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            - --leader-election-id={{ .Values.leaderElectionID }}
            {{- end }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --health-probe-bind-address={{ .Values.healthProbes.bindAddress }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --requeue-interval={{ .Values.controller.requeueInterval }}
            - --snowflake-op-timeout={{ .Values.controller.snowflakeOpTimeout }}
            - --rate-limit-qps={{ .Values.rateLimit.qps }}
            - --rate-limit-burst={{ .Values.rateLimit.burst }}
            - --account-rate-limit-qps={{ .Values.rateLimit.accountQps }}
            - --account-rate-limit-burst={{ .Values.rateLimit.accountBurst }}
            {{- if not .Values.controller.enableAlphaResources }}
            - --enable-alpha-resources=false
            {{- end }}
            {{- if .Values.logging.development }}
            - --development
            {{- end }}
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces={{ . }}
            {{- end }}
            {{- with .Values.controller.disableControllers }}
            - --disable-controllers={{ . }}
            {{- end }}
            {{- with .Values.controller.allowedRoles }}
            - --allowed-roles={{ . }}
            {{- end }}
            - --circuit-breaker-threshold={{ .Values.circuitBreaker.threshold }}
            - --circuit-breaker-reset-timeout={{ .Values.circuitBreaker.resetTimeout }}
            - --zap-log-level={{ .Values.logging.level }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.containerPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthProbes.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.workloadIdentity.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.workloadIdentity.enabled }}
            - name: snowflake-token
              mountPath: {{ .Values.workloadIdentity.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.workloadIdentity.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.workloadIdentity.enabled }}
        - name: snowflake-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
                  path: {{ .Values.workloadIdentity.tokenFileName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
