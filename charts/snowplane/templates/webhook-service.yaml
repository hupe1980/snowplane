{{- if .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "snowplane.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    {{- include "snowplane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
{{- end }}
