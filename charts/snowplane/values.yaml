# Default values for snowplane.

# -- Number of controller manager replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/hupe1980/snowplane
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to chart appVersion)
  tag: ""
  # -- Image digest (e.g. sha256:abc123...). When set, overrides tag for immutable image references.
  # Recommended for production deployments requiring supply chain security.
  digest: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Override the release name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount (e.g. for IRSA/Workload Identity)
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Workload Identity Federation configuration for passwordless Snowflake authentication.
# When enabled, a projected ServiceAccount token volume is mounted into the controller pod.
workloadIdentity:
  # -- Enable projected ServiceAccount token volume for Workload Identity Federation
  enabled: false
  # -- Token audience (must match the Snowflake security integration configuration)
  audience: ""
  # -- Token expiration in seconds (kubelet refreshes before expiry)
  expirationSeconds: 3600
  # -- Mount path for the projected token volume
  mountPath: /var/run/secrets/snowflake
  # -- Token file name within the mount path
  tokenFileName: token

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

controller:
  # -- Maximum concurrent reconciles per controller
  maxConcurrentReconciles: 3
  # -- Requeue interval for drift detection
  requeueInterval: 5m
  # -- Enable alpha-maturity resource controllers
  enableAlphaResources: true
  # -- Enable the SQLStatement escape-hatch controller.
  # WARNING: This allows executing arbitrary SQL against Snowflake — use with caution.
  enableSQLStatement: false
  # -- Comma-separated list of controllers to disable (e.g. "grant,view")
  disableControllers: ""
  # -- Comma-separated allowlist of Snowflake roles permitted in ProviderConfig (case-insensitive).
  # If empty, all roles are allowed. Example: "SYSADMIN,USERADMIN,DATA_ENGINEER".
  # Set this to prevent namespace admins from escalating to ACCOUNTADMIN or SECURITYADMIN.
  allowedRoles: ""
  # -- Per-operation timeout for Snowflake CRUD calls (Observe, Create, Alter, Drop).
  # Increase for large Snowflake accounts or complex operations.
  snowflakeOpTimeout: 60s

# -- Hash-based controller sharding for horizontal scaling.
# When enabled, each replica deterministically owns a subset of resources
# based on FNV-1a hash of namespace/name. See docs/production-guide.md.
sharding:
  # -- Enable hash-based sharding. Deploy one Helm release per shard,
  # each with a unique shardID in [0, shardCount).
  enabled: false
  # -- Zero-based shard index for this instance.
  shardID: 0
  # -- Total number of shards. Must be >= 1.
  shardCount: 1

# -- Circuit breaker configuration for per-provider failure isolation
circuitBreaker:
  # -- Consecutive failures before the circuit opens
  threshold: 5
  # -- Duration the circuit stays open before allowing a probe request
  resetTimeout: 60s

leaderElection:
  # -- Enable leader election
  enabled: true

metrics:
  # -- Enable metrics endpoint
  enabled: true
  # -- Metrics bind address
  bindAddress: ":8080"
  # -- Container port for metrics endpoint (must match port in bindAddress)
  containerPort: 8080
  service:
    # -- Create a Service for the metrics endpoint
    enabled: true
    # -- Metrics service port
    port: 8080
  serviceMonitor:
    # -- Create a Prometheus ServiceMonitor
    enabled: false
    # -- Additional labels for the ServiceMonitor
    additionalLabels: {}
    # -- Scrape interval
    interval: 30s
  prometheusRule:
    # -- Create a PrometheusRule with default alert rules
    enabled: false
    # -- Additional labels for the PrometheusRule
    additionalLabels: {}

healthProbes:
  # -- Health probe bind address
  bindAddress: ":8081"
  # -- Container port for health probes (must match port in bindAddress)
  containerPort: 8081

rateLimit:
  # -- Maximum sustained queries per second to Snowflake per controller per provider (0 = disabled)
  qps: 10
  # -- Maximum burst size for per-controller Snowflake API rate limiter
  burst: 20
  # -- Maximum aggregate queries per second to Snowflake per account (provider) across all controllers (0 = disabled)
  accountQps: 50
  # -- Maximum burst size for per-account aggregate Snowflake API rate limiter
  accountBurst: 100

logging:
  # -- Log level (info, debug, error)
  level: info
  # -- Enable development mode (human-readable output)
  development: false

# -- PodDisruptionBudget configuration
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# -- NetworkPolicy configuration.
# Restricts ingress to metrics + health-probe ports and egress to DNS, HTTPS, and Kubernetes API.
networkPolicy:
  # -- Create a NetworkPolicy for the controller pod. Enabled by default for defense-in-depth.
  enabled: true
  # -- Restrict DNS egress to pods in the kube-system namespace (kube-dns / CoreDNS).
  # Set to false if your cluster runs DNS outside kube-system (e.g. node-local-dns in a custom namespace).
  restrictDNS: true
  # -- Restrict HTTPS/Kubernetes API egress to specific CIDRs.
  # When non-empty, only these destinations are reachable on ports 443 and 6443.
  # Include both Snowflake IP ranges AND your Kubernetes API server endpoint.
  # When empty (default), HTTPS egress is allowed to all destinations.
  # Example:
  #   egressCIDRs:
  #     - 52.25.0.0/16       # Snowflake US West (AWS)
  #     - 104.198.0.0/16     # Snowflake US Central (GCP)
  #     - 10.96.0.1/32       # Kubernetes API server ClusterIP
  egressCIDRs: []
  # -- Restrict metrics ingress to pods in a specific namespace (e.g. monitoring).
  # When set, only pods in this namespace can reach the metrics and health-probe ports.
  # When empty (default), any source can reach those ports.
  metricsNamespace: ""
  # -- Additional egress rules appended to the generated policy.
  # Use this for sidecar proxies, external log sinks, or OCSP responders.
  extraEgress: []
  # -- Additional ingress rules appended to the generated policy.
  extraIngress: []

# -- Priority class name for pod scheduling (e.g. system-cluster-critical for production)
priorityClassName: ""

# -- Topology spread constraints for pod scheduling.
# When replicaCount > 1, this ensures pods are spread across failure domains.
# Example:
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: ScheduleAnyway
#       labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: snowplane
topologySpreadConstraints: []

# -- Comma-separated list of namespaces to watch. Empty means all namespaces.
watchNamespaces: ""

rbac:
  secrets:
    # -- Grant read access (get, list, watch) to Secrets cluster-wide.
    # Required when ProviderConfig uses key-pair or username/password authentication.
    # Can be set to false when all ProviderConfigs use Workload Identity Federation
    # and no FieldExport targets a Secret.
    read: true
    # -- Grant write access (create, patch, delete) to Secrets cluster-wide.
    # Required only when FieldExport resources target Secrets.
    # Disabled by default to follow least-privilege principles.
    write: false
  configMaps:
    # -- Grant write access (create, patch, delete) to ConfigMaps cluster-wide.
    # Required only when FieldExport resources target ConfigMaps.
    # Read access (get, list, watch) is always granted for leader election.
    # Disabled by default to follow least-privilege principles.
    write: false

# -- Leader election identity. Override when running multiple Snowplane instances
# in the same cluster to prevent leader election conflicts.
leaderElectionID: "snowplane-leader-election"

# -- Additional environment variables for the controller container
extraEnv: []
# -- Additional volumes for the pod
extraVolumes: []
# -- Additional volume mounts for the controller container
extraVolumeMounts: []

# -- Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 3

# -- Grafana dashboard provisioning
grafana:
  dashboard:
    # -- Deploy a Grafana dashboard ConfigMap (requires Grafana sidecar provisioner)
    enabled: false
    # -- Namespace to deploy the dashboard ConfigMap (defaults to release namespace)
    namespace: ""
    # -- Additional labels for the dashboard ConfigMap (e.g. for sidecar discovery)
    labels: {}
    # -- Annotations for the dashboard ConfigMap
    annotations: {}

# -- Ownership-conflict validating admission webhook.
# Rejects CRs at admission time when another CR already manages the same
# Snowflake resource, preventing post-reconciliation conflict detection.
webhook:
  # -- Enable the ownership-conflict validating webhook.
  enabled: false
  # -- Webhook failure policy: Ignore (safe default — allows admission if the webhook
  # is unreachable) or Fail (strict — rejects admission on webhook failure).
  failurePolicy: Ignore
  # -- Webhook timeout in seconds (API server aborts after this duration).
  timeoutSeconds: 10
  # -- Webhook server port inside the controller pod.
  port: 9443
  # -- Directory inside the pod where TLS cert/key are mounted.
  certDir: /tmp/k8s-webhook-server/serving-certs
  # -- Optional namespace selector to limit webhook scope.
  # Example: matchLabels: { snowplane-webhook: "enabled" }
  namespaceSelector: {}
  # -- cert-manager integration for automatic TLS certificate provisioning.
  certManager:
    # -- Use cert-manager to provision and inject the webhook TLS certificate.
    enabled: true
    # -- Override the issuer reference. When empty, a self-signed Issuer is created automatically.
    issuerRef: {}
  # -- Base64-encoded CA bundle (only needed when certManager.enabled is false).
  caBundle: ""
